<div id="cw-settings-study" class="viz-dotted-background">
  <section class="st-case" data-theme="green" aria-label="Настройки — интерактивный эскиз">
    <div class="st-window">
      <header class="st-header">
        <i data-lucide="settings-2" aria-hidden="true"></i><h2>Настройки</h2>
        <button class="st-key cursor-interaction" data-action="search" aria-label="Найти настройку" data-tooltip="Найти настройку"><i data-lucide="search" aria-hidden="true"></i></button>
        <button class="st-key cursor-interaction" data-action="help" aria-label="Справка" data-tooltip="Справка"><i data-lucide="circle-help" aria-hidden="true"></i></button>
        <button class="st-key st-wide cursor-interaction" data-action="minimize" aria-label="Свернуть окно" data-tooltip="Свернуть окно"><i data-lucide="minus" aria-hidden="true"></i></button>
        <button class="st-key cursor-interaction" data-action="close" aria-label="Закрыть окно" data-tooltip="Закрыть окно"><i data-lucide="x" aria-hidden="true"></i></button>
      </header>
      <div class="st-search" hidden><i data-lucide="search" aria-hidden="true"></i><input aria-label="Поиск по настройкам" placeholder="Тема, пароль, лимиты…" type="search"><button class="st-key cursor-interaction" data-action="search-close" aria-label="Закрыть поиск"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="st-body">
        <nav class="st-nav" aria-label="Разделы настроек"></nav>
        <button class="st-grip st-wide" aria-label="Ширина списка разделов: 220 пикселей" data-tooltip="Потяни или используй стрелки ← →"></button>
        <main class="st-screen">
          <div class="st-path"><button class="st-screen-key cursor-interaction" data-action="back" aria-label="Назад"><i data-lucide="arrow-left" aria-hidden="true"></i></button><span></span></div>
          <div class="st-content"></div>
        </main>
      </div>
    </div>
    <div class="st-parked" hidden><i data-lucide="settings-2" aria-hidden="true"></i><p></p><button class="st-key cursor-interaction" data-action="restore">Вернуться к настройкам</button></div>
    <div class="st-overlay" hidden><section class="st-dialog" role="dialog" aria-modal="true" aria-label="Действие в эскизе"><header><h3></h3><button class="st-key cursor-interaction" data-action="dismiss" aria-label="Закрыть сообщение"><i data-lucide="x" aria-hidden="true"></i></button></header><div class="st-dialog-body"></div><footer><button class="st-key cursor-interaction" data-action="dismiss">Понятно</button></footer></section></div>
  </section>
</div>
<style>

 #cw-settings-study .st-content{padding:16px 12px 24px;min-height:464px}

</style>
<script>
(()=>{
 const root=document.getElementById('cw-settings-study'),q=s=>root.querySelector(s),box=q('.st-case'),content=q('.st-content');
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const groups=[['interface','Интерфейс','sliders-horizontal'],['connections','Подключения','plug'],['data','История и данные','archive'],['maintenance','Обновления и диагностика','wrench'],['account','Мой аккаунт','user-round'],['people','Пользователи и доступ','users-round']];
 const themes={green:'Зелёная',2000:'2000',organizer:'Органайзер',dark:'Тёмная'};
 const defaults={theme:'green',admin:true,gptState:'connected',page:'connections',navWidth:220,settings:{speech:false,push:true,legacy:false,text:100,scale:100,doctor:'diagnose'},drafts:{deviceName:'Мой компьютер'},stack:[]};
 let state=structuredClone(defaults),searchOpen=false,query='',parked=false,returnFocus=null;
 const pages={};
 const page=(id,parent,title,subtitle,render,keywords='')=>pages[id]={parent,title,subtitle,render,keywords};
 const row=(id,title,subtitle='',value='',glyph='chevron-right')=>`<button class="st-row cursor-interaction" data-go="${id}"><span><strong>${title}</strong>${subtitle?`<small>${subtitle}</small>`:''}</span><span class="st-value">${value}</span>${icon(glyph)}</button>`;
 const action=(id,label,primary=false)=>`<button class="st-key cursor-interaction ${primary?'st-primary':''}" data-demo="${id}">${label}</button>`;
 const actions=(...items)=>`<div class="st-actions">${items.join('')}</div>`;
 const toggle=(id,title,sub='')=>`<label class="st-row"><span><strong>${title}</strong><small>${sub}</small></span><input class="st-toggle" type="checkbox" data-setting="${id}" ${state.settings[id]?'checked':''}></label>`;
 const select=(id,label,options,value)=>`<label class="st-field">${label}<select data-setting="${id}">${options.map(([v,t])=>`<option value="${v}" ${String(value??state.settings[id])===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
 const facts=items=>`<dl class="st-facts">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
 const meter=(title,value,percent)=>`<div class="st-meter"><div><span>${title}</span><span>${value}</span></div><div class="st-meter-track"><span style="width:${percent}%"></span></div></div>`;
 const badge=s=>`<span class="st-badge">${s}</span>`;
 const demoRow=(id,title,sub='')=>`<button class="st-row cursor-interaction" data-demo="${id}"><span><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span>${icon('chevron-right')}</button>`;
 page('interface',null,'Интерфейс','Внешний вид, управление и звук.',()=>row('appearance','Оформление','Тема, вариант и цвет корпуса',themes[state.theme])+row('scale','Текст и масштаб','Размер текста и элементов')+row('keys','Клавиши и поведение','Сочетания клавиш, компоновка')+row('sound','Озвучивание и уведомления','Голос и события'));
 page('appearance','interface','Оформление','Один интерфейс — разные материалы.',()=>`<div class="st-theme-grid">${Object.entries(themes).map(([id,name])=>`<button class="st-theme cursor-interaction" data-theme-choice="${id}" aria-pressed="${state.theme===id}">${icon(id==='organizer'?'notebook':'monitor')}<span>${name}</span></button>`).join('')}</div>`+select('variant','Вариант',[['normal','Основной'],['quiet','Спокойный']],state.settings.variant||'normal')+select('casing','Цвет корпуса',[['native','По теме'],['graphite','Графит']],state.settings.casing||'native'),'тема зеленая 2000 органайзер тёмная цвет');
 page('scale','interface','Текст и масштаб','Настройки этого браузера.',()=>['text','scale'].map((id,i)=>`<label class="st-field">${i?'Элементы интерфейса':'Размер текста'} · <output>${state.settings[id]}%</output><input type="range" min="85" max="130" step="5" data-setting="${id}" value="${state.settings[id]}"></label>`).join('')+`<div class="st-sample" style="font-size:${state.settings.text/100}em"><h4>Пример</h4><p>Диалоги, файлы и результаты твоей работы.</p></div>`,'шрифт размер');
 page('keys','interface','Клавиши и поведение','Сочетания открываются отдельно и не мешают остальным настройкам.',()=>row('shortcuts','Сочетания клавиш','Просмотреть и переназначить')+toggle('legacy','Старая компоновка','Сохраняем существующий вариант интерфейса.'));
 page('shortcuts','keys','Сочетания клавиш','Выбери команду для изменения сочетания.',()=>demoRow('shortcut','Поиск и команды','Ctrl / ⌘ K')+demoRow('shortcut','Новый диалог','Ctrl / ⌘ Shift O')+demoRow('shortcut','Отправить сообщение','Enter')+actions(action('reset-keys','Сбросить сочетания')),'горячие клавиши');
 page('sound','interface','Озвучивание и уведомления','Звук ответа и уведомления о событиях.',()=>toggle('speech','Озвучивать ответы','Автоматическое чтение новых ответов.')+select('voice','Голос',[['system','Системный'],['sample','Другой доступный голос']],state.settings.voice||'system')+toggle('push','Уведомления','Ответы и события в твоих пространствах.')+demoRow('notification-repair','Проверить уведомления','Разрешение браузера и подписка'),'голос звук push');
 page('connections',null,'Подключения','Устройства и аккаунты, которыми ты пользуешься.',()=>`<h4>Мои устройства</h4>`+row('pc','Мой компьютер','Windows · прямое подключение','На связи','monitor')+row('workspace','Моё серверное окружение','Linux · личные файлы и проекты','Готово','server')+row('add','Добавить компьютер','Установщик и подключение','', 'plus')+`<h4>Сервисы</h4>`+row('codex','Codex','Аккаунт, лимиты и инструменты','Мой ПК','terminal')+row('gpt','ChatGPT','Аккаунт и подключение',gptLabel(),'messages-square'));
 page('pc','connections','Мой компьютер','Windows · прямое подключение',()=>badge('На связи')+facts([['Companion','Готов'],['Codex','Подключён'],['Проекты','8 папок']])+row('pc-components','Готовность и компоненты','Проверки, установка и восстановление')+demoRow('projects','Папки проектов','8 подключённых папок')+row('codex','Codex на этом компьютере','Аккаунт, лимиты, управление')+actions(action('pc-system','Система'),action('pc-terminal','Терминал'))+demoRow('revoke','Отключить от аккаунта'),'компьютер Windows companion ПК');

  'shortcut':['Изменить сочетание','Здесь открывается запись сочетания для выбранной команды. Только открытый редактор перехватывает клавиши.'],
  'update-details':['Сведения об установке','Версии приведены по последней проверке в репозитории. Этот эскиз не проверяет сервер и не устанавливает обновления.']
 };
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{study:'settings',section:pages[state.page]?.title||'Разделы',theme:themes[state.theme],admin:state.admin},privateContent:state}).catch(()=>{});}
 function validPage(id){return id==='index'||(pages[id]&&(state.admin||!['people','members','invites'].includes(id)));}
 function hydrate(snapshot){const v=snapshot?.privateContent;if(!v||typeof v!=='object')return;state={...structuredClone(defaults),...v,settings:{...defaults.settings,...v.settings},drafts:{...defaults.drafts,...v.drafts}};if(!themes[state.theme])state.theme='green';if(!['connected','prepare','login','activate'].includes(state.gptState))state.gptState='connected';if(!validPage(state.page))state.page='connections';state.navWidth=Math.max(180,Math.min(280,Number(state.navWidth)||220));state.stack=Array.isArray(state.stack)?state.stack.filter(validPage).slice(-10):[];}
 function currentGroup(id){while(pages[id]?.parent)id=pages[id].parent;return id;}
 function render(){
  box.dataset.theme=state.theme;box.dataset.variant=state.settings.variant||'normal';box.dataset.casing=state.settings.casing||'native';box.dataset.page=searchOpen?'search':state.page;box.style.setProperty('--st-nav-width',state.navWidth+'px');
  q('.st-window').hidden=parked;q('.st-parked').hidden=!parked;q('.st-search').hidden=!searchOpen;
  q('.st-grip').setAttribute('aria-label',`Ширина списка разделов: ${state.navWidth} пикселей`);
  q('.st-nav').innerHTML=groups.filter(([id])=>id!=='people'||state.admin).map(([id,label,glyph])=>`${id==='people'?'<div class="st-admin">':''}<button class="cursor-interaction" data-go="${id}" ${currentGroup(state.page)===id?'aria-current="page"':''}>${icon(glyph)}<span>${label}${id==='people'?'<small>Администрирование</small>':''}</span></button>${id==='people'?'</div>':''}`).join('');
  const active=pages[state.page]||pages.connections;
  q('.st-path span').textContent=searchOpen?'Поиск по всем настройкам':active.parent?(pages[active.parent]?.title||'Настройки'):'Настройки';
  q('[data-action="back"]').hidden=!searchOpen&&state.page==='index';
  if(searchOpen){
   const needle=query.trim().toLocaleLowerCase('ru'),entries=[];
   for(const [id,p] of Object.entries(pages)){if(!validPage(id))continue;const path=[];let next=id;while(pages[next]){path.unshift(pages[next].title);next=pages[next].parent;}
    entries.push({id,title:p.title,path:path.join(' → '),words:p.title+' '+p.subtitle+' '+p.keywords});
    const template=document.createElement('template');template.innerHTML=p.render();
    for(const item of template.content.querySelectorAll('[data-demo]')){const title=item.querySelector('strong')?.textContent||item.textContent;entries.push({id,action:item.dataset.demo,title,path:path.join(' → '),words:title+' '+item.textContent});}
   }
   const matches=entries.filter(p=>p.words.toLocaleLowerCase('ru').includes(needle));
   content.innerHTML='<h3>Найти настройку</h3>'+(needle?`<p class="st-intro">Найдено: ${matches.length}</p>`+matches.map(p=>p.action?`<button class="st-row cursor-interaction" data-open-action="${p.action}" data-parent="${p.id}"><span><strong>${esc(p.title)}</strong><small>${esc(p.path)}</small></span>${icon('chevron-right')}</button>`:row(p.id,p.title,p.path)).join(''):'<p class="st-empty">Введи название: например, «кредиты» или «пароль».</p>');
   if(needle&&!matches.length)content.innerHTML+='<p class="st-empty">Попробуй другое название.</p>';
  }
  else content.innerHTML=`<h3>${active.title}</h3><p class="st-intro">${active.subtitle}</p>${active.render()}`;
  if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});
 }
 function go(id){if(!validPage(id))return;state.stack.push(state.page);state.stack=state.stack.slice(-10);state.page=id;searchOpen=false;render();persist();q('[data-action="back"]').focus({preventScroll:true});}
 function back(){if(searchOpen){searchOpen=false;query='';q('.st-search input').value='';render();return;}state.page=state.stack.pop()||pages[state.page]?.parent||'index';render();persist();if(state.page==='index')q('.st-nav button').focus({preventScroll:true});}
 function dialog(title,body,trigger=document.activeElement){returnFocus=trigger;q('.st-dialog h3').textContent=title;q('.st-dialog-body').textContent=body;q('.st-overlay').hidden=false;q('.st-dialog [data-action="dismiss"]').focus({preventScroll:true});}
 function closeDialog(){q('.st-overlay').hidden=true;if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.openAction){const id=b.dataset.openAction,parent=b.dataset.parent;go(parent);const target=q(`[data-demo="${id}"]`);target?.click();return;}
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.themeChoice){state.theme=b.dataset.themeChoice;render();persist();return;}
  const a=b.dataset.action;
  if(a==='search'){searchOpen=!searchOpen;render();if(searchOpen)q('.st-search input').focus({preventScroll:true});}
  else if(a==='search-close'){searchOpen=false;query='';q('.st-search input').value='';render();q('[data-action="search"]').focus({preventScroll:true});}
  else if(a==='back')back();
  else if(a==='help')dialog(...effects.help,b);
  else if(a==='dismiss')closeDialog();
  else if(a==='close'||a==='minimize'){parked=true;q('.st-parked p').textContent=a==='close'?'Настройки закрыты':'Настройки свёрнуты';render();q('[data-action="restore"]').focus({preventScroll:true});}
  else if(a==='restore'){parked=false;render();q('[data-action="search"]').focus({preventScroll:true});}
  if(b.dataset.demo){const id=b.dataset.demo;
   if(['prepare-gpt','login-gpt','activate-gpt'].includes(id)){state.gptState={'prepare-gpt':'login','login-gpt':'activate','activate-gpt':'connected'}[id];render();persist();dialog('Демонстрация шага','В эскизе показано следующее состояние. Реальная подготовка, вход или активация не выполнялись.');return;}
   const effect=effects[id]||[b.textContent.trim(),'Эскиз: здесь открывается существующее действие для выбранного объекта. Реальное действие не выполнялось.'];
   dialog(effect[0],effect[1].replace('{deviceName}',state.drafts.deviceName),b);
  }
 });
 root.addEventListener('input',e=>{const el=e.target;if(el.matches('.st-search input')){query=el.value;render();return;}if(el.dataset.draft){state.drafts[el.dataset.draft]=el.value;persist();}if(el.type==='range'){state.settings[el.dataset.setting]=Number(el.value);el.parentElement.querySelector('output').textContent=el.value+'%';const sample=q('.st-sample');if(sample)sample.style.fontSize=state.settings.text/100+'em';}});
 root.addEventListener('change',e=>{const el=e.target;if(!el.dataset.setting)return;state.settings[el.dataset.setting]=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;if(['variant','casing'].includes(el.dataset.setting)){box.dataset.variant=state.settings.variant||'normal';box.dataset.casing=state.settings.casing||'native';}persist();});
 root.addEventListener('keydown',e=>{if(!q('.st-overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const buttons=[...q('.st-dialog').querySelectorAll('button')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&e.target===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&e.target===last){e.preventDefault();first.focus();}}return;}if(e.key==='Escape'&&searchOpen){e.preventDefault();searchOpen=false;render();q('[data-action="search"]').focus();}});
 const grip=q('.st-grip');let drag=null;
 grip.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home'].includes(e.key))return;e.preventDefault();state.navWidth=e.key==='Home'?220:Math.max(180,Math.min(280,state.navWidth+(e.key==='ArrowRight'?10:-10)));box.style.setProperty('--st-nav-width',state.navWidth+'px');grip.setAttribute('aria-label',`Ширина списка разделов: ${state.navWidth} пикселей`);persist();});
 grip.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,width:state.navWidth,id:e.pointerId};grip.setPointerCapture(e.pointerId);});
 grip.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;state.navWidth=Math.round(Math.max(180,Math.min(280,drag.width+e.clientX-drag.x)));box.style.setProperty('--st-nav-width',state.navWidth+'px');});
 grip.addEventListener('pointerup',()=>{if(!drag)return;drag=null;grip.setAttribute('aria-label',`Ширина списка разделов: ${state.navWidth} пикселей`);persist();});
 grip.addEventListener('pointercancel',()=>{if(drag)state.navWidth=drag.width;drag=null;box.style.setProperty('--st-nav-width',state.navWidth+'px');});
 hydrate(window.openai?.widgetState);if(!window.openai?.widgetState?.privateContent&&root.clientWidth<640)state.page='index';render();
 window.addEventListener('openai:set_globals',e=>{if(!e.detail?.globals?.widgetState)return;hydrate(e.detail.globals.widgetState);searchOpen=false;query='';q('.st-search input').value='';parked=false;closeDialog();render();});
 if(globalThis.Tweak){const design={theme:state.theme,admin:state.admin,gptState:state.gptState};const tweak=new Tweak({container:box,onChange:()=>{state.theme=design.theme;state.admin=design.admin;state.gptState=design.gptState;if(!validPage(state.page))state.page='account';render();persist();}});tweak.addSelect(design,'theme',{label:'Тема',options:Object.entries(themes).map(([value,label])=>({value,label}))});tweak.addToggle(design,'admin',{label:'Показать администрирование'});tweak.addSelect(design,'gptState',{label:'Состояние GPT',options:[{value:'connected',label:'Подключён'},{value:'prepare',label:'Первое подключение'},{value:'login',label:'Нужен вход'},{value:'activate',label:'Готов к активации'}]});}
})();
