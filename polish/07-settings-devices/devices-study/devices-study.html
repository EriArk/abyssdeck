  <section class="dw-case" data-theme="green" aria-label="Устройства — эскиз">

      <header class="dw-header">
        <i data-lucide="computer" aria-hidden="true"></i><h2>Устройства</h2>

        <button class="dw-key dw-wide cursor-interaction" data-action="minimize" aria-label="Свернуть окно" data-tooltip="Свернуть окно"><i data-lucide="minus" aria-hidden="true"></i></button>

      </header>
      <div class="dw-machine-row">
        <button class="dw-machine cursor-interaction" data-menu="machines" aria-expanded="false" aria-label="Выбрать устройство">

        </button>
        <span class="dw-updated">Обновлено 12:40</span>

      </div>

        <button class="cursor-interaction" data-page="system" aria-pressed="false">Система</button>
        <button class="cursor-interaction" data-page="terminal" aria-pressed="true">Терминал</button>
      </nav>
      <div class="dw-aperture" data-page="terminal">

          <div class="dw-specs"></div>

        <button class="dw-grip dw-wide" aria-label="Изменить ширину сведений" data-tooltip="Потяни или используй стрелки ← →" data-action="grip"></button>
        <section class="dw-console" aria-label="Терминал устройства">
          <div class="dw-terminal-head">
            <button class="dw-screen-key dw-restore cursor-interaction" data-action="collapse" aria-label="Показать сведения" data-tooltip="Показать сведения"><i data-lucide="panel-left-open" aria-hidden="true"></i></button>
            <button class="dw-session cursor-interaction" data-menu="sessions" aria-label="Выбрать терминал" aria-expanded="false"><span>Терминал 1</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
            <span class="dw-terminal-status">Подключено</span>
            <button class="dw-screen-key cursor-interaction" data-action="new" aria-label="Новый терминал" data-tooltip="Новый терминал"><i data-lucide="plus" aria-hidden="true"></i></button>
            <button class="dw-screen-key cursor-interaction" data-menu="terminal" aria-label="Действия терминала" aria-expanded="false" data-tooltip="Действия терминала"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
          </div>
          <div class="dw-output"><pre></pre></div>
          <form class="dw-input" hidden>
            <label><span class="dw-input-label">Команда</span><input aria-label="Команда в эскизе" autocomplete="off" spellcheck="false" placeholder="Только пример, без выполнения"></label>
            <div><button type="button" class="dw-key cursor-interaction" data-action="paste">Вставить</button><button type="button" data-action="submit-input" class="dw-key dw-primary cursor-interaction">Ввести</button><button type="button" class="dw-key cursor-interaction" data-action="input-close" aria-label="Закрыть ввод"><i data-lucide="x" aria-hidden="true"></i></button></div>

          <div class="dw-keys" role="toolbar" aria-label="Клавиши терминала">
            <button class="dw-key cursor-interaction" data-action="input" aria-label="Ввести команду">Ввод</button>
            <button class="dw-key cursor-interaction" data-action="password" aria-label="Ввести пароль" data-tooltip="Ввести пароль"><i data-lucide="lock-keyhole" aria-hidden="true"></i></button>
            <button class="dw-key cursor-interaction" data-action="keyboard" aria-label="Открыть клавиатуру" data-tooltip="Открыть клавиатуру"><i data-lucide="keyboard" aria-hidden="true"></i></button>

            <button class="dw-key cursor-interaction" data-key="Ctrl C">Ctrl C</button>

          </div>
        </section>
      </div>
    </div>
    <div class="dw-parked" hidden><i data-lucide="computer" aria-hidden="true"></i><p class="dw-parked-title">Устройства свёрнуты</p><button class="dw-key cursor-interaction" data-action="restore">Вернуться к устройствам</button></div>
    <div class="dw-popover" hidden></div>

  </section>
</div>

 const sessions={};let menu='',menuTrigger=null,overlayAction='',overlayTrigger=null,entry='',resize=null;
 const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icons=()=>globalThis.lucide?.createIcons({attrs:{width:19,height:19}});
 const item=(action,label,icon,extra='')=>`<button class="cursor-interaction ${extra}" data-action="${action}"><i data-lucide="${icon}" aria-hidden="true"></i><span>${label}</span></button>`;
 function machine(){return devices[state.device];}
 function local(){return sessions[state.device]??=( {page:'terminal',selected:1,list:[{id:1,closed:false,output:state.device==='pc'?'PowerShell\n\nPS C:\\Users\\User> ':state.device==='workspace'?'Личное окружение Linux\n\nuser@workspace:~$ ':'Ubuntu Linux\n\nuser@server:~$ ',draft:''}]});}
 function selected(){return local().list.find(s=>s.id===local().selected);}
 function save(){window.openai?.setWidgetState({modelContent:{theme:state.theme,device:state.device,view:local().page,collapsed:state.collapsed},privateContent:{...state}}).catch(()=>{});}
 function notice(text){q('.dw-notice span').textContent=text;q('.dw-notice').hidden=false;}
 function closeMenu(focus=false){q('.dw-popover').hidden=true;all('[data-menu][aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'));menu='';if(focus)menuTrigger?.focus();}
 function closeOverlay(){q('.dw-overlay').hidden=true;q('.dw-main').inert=false;overlayAction='';overlayTrigger?.focus();}
 function inputClose(){if(entry==='command')selected().draft=q('.dw-input input').value;q('.dw-input input').value='';q('.dw-input').hidden=true;entry='';}
 function render(){
  const d=machine(),l=local(),s=selected();q('.dw-case').dataset.theme=state.theme;q('.dw-case').dataset.collapsed=state.collapsed;
  q('.dw-case').style.setProperty('--dw-panel',state.width+'px');q('[data-action="grip"]').setAttribute('aria-label',`Ширина сведений ${state.width} пикселей; стрелки изменяют ширину`);
  q('.dw-machine-label').innerHTML=`${escape(d.name)} <small>${d.platform}</small>`;q('.dw-machine').setAttribute('data-tooltip',d.name+' · '+d.platform);
  q('.dw-online').textContent=state.offline?'Нет связи':'В сети';q('.dw-terminal-status').textContent=s.closed?'Завершён':state.offline?'Нет связи':'Подключено';
  q('.dw-session span').textContent=(state.device==='pc'?'PowerShell ':'Терминал ')+s.id;
  q('.dw-aperture').dataset.page=l.page;all('[data-page][aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===l.page)));
  q('.dw-specs').innerHTML=`<p class="dw-os">${escape(d.os)}</p><small>${d.host} · x86_64</small>${state.offline?'<p class="dw-note">Последние сведения · 12:40</p>':''}<dl><div><dt>Процессор</dt><dd>${escape(d.cpu)}</dd></div><div><dt>Без перезагрузки</dt><dd>20 ч. 40 мин.</dd></div></dl><div class="dw-meter"><div><span>Память</span><span>${d.memory}</span></div><div class="dw-track"><span style="width:${state.device==='server'?47:state.device==='pc'?29:14}%"></span></div></div><h4>Диски</h4><div class="dw-meter"><div><span>${d.mount}</span><span>${d.disk}</span></div><div class="dw-track"><span style="width:${state.device==='server'?20:state.device==='pc'?46:15}%"></span></div></div><h4>Температура</h4><p>${state.device==='workspace'?'Датчики недоступны':'CPU · 48 °C'}</p>`;
  q('.dw-output pre').textContent=s.output+(s.closed?'\nСессия завершена.':'');
  all('.dw-keys button,.dw-extra button,[data-action="submit-input"]').forEach(b=>b.disabled=state.offline||s.closed);
  q('[data-action="new"]').disabled=state.offline||l.list.length>=5;
  icons();
 }
 function showMenu(kind,b){const show=menu!==kind||q('.dw-popover').hidden;closeMenu();if(!show)return;menu=kind;menuTrigger=b;b.setAttribute('aria-expanded','true');const p=q('.dw-popover');p.dataset.menu=kind;
  if(kind==='machines')p.innerHTML=Object.entries(devices).map(([id,d])=>`<button class="cursor-interaction" data-device="${id}" aria-pressed="${id===state.device}"><i data-lucide="${id==='pc'?'monitor':'server'}" aria-hidden="true"></i><span>${d.name}<small>${d.platform}</small></span>${id===state.device?'<i data-lucide="check" aria-hidden="true"></i>':''}</button>`).join('');
  if(kind==='device')p.innerHTML=(machine().mounts?item('mount','Подключить сетевой диск','folder-plus'):'')+(machine().power?'<hr>'+item('restart','Перезагрузить…','rotate-ccw','dw-danger')+item('shutdown','Выключить…','power','dw-danger'):'<p class="dw-note">Питание управляется сервером.</p>');
  if(kind==='sessions')p.innerHTML=local().list.map(s=>`<button class="cursor-interaction" data-session="${s.id}" aria-pressed="${s.id===local().selected}"><i data-lucide="terminal" aria-hidden="true"></i><span>${state.device==='pc'?'PowerShell':'Терминал'} ${s.id}<small>${s.closed?'Завершён':'Открыт'}</small></span></button>`).join('');
  if(kind==='terminal')p.innerHTML=item('end','Завершить сессию…','square','dw-danger');
  p.hidden=false;p.style.top=(kind==='sessions'||kind==='terminal')?(b.getBoundingClientRect().bottom-q('.dw-case').getBoundingClientRect().top+4)+'px':'';icons();p.querySelector('button')?.focus();
 }
 function overlay(action,b){overlayAction=action;overlayTrigger=b;closeMenu();q('.dw-notice').hidden=true;q('.dw-main').inert=true;q('.dw-overlay').hidden=false;const d=machine(),content=q('.dw-dialog-content');q('.dw-dialog [data-action="confirm"]').hidden=false;q('.dw-dialog [data-action="cancel"]').textContent='Отмена';
  if(action==='help'){q('.dw-dialog h3').textContent='Устройства';content.innerHTML='<p>Сведения и терминалы выбранной машины в одном окне.</p><p>Сворачивание сохраняет работу. Закрытие освобождает свободные терминалы; выполняющаяся команда завершается своим ходом.</p><p>Здесь показан эскиз: команды, питание и подключение дисков не выполняются.</p>';q('[data-action="confirm"]').hidden=true;q('[data-action="cancel"]').textContent='Понятно';}
  else if(action==='mount'){q('.dw-dialog h3').textContent='Сетевой диск · '+d.name;content.innerHTML=`<label>Протокол<select aria-label="Протокол"><option>SMB</option>${d.platform==='Windows'?'':'<option>NFS</option>'}</select></label><label>Адрес<input aria-label="Адрес диска" placeholder="//server/share"></label><label>${d.platform==='Windows'?'Буква диска':'Папка в ~/mnt'}<input aria-label="Назначение диска" value="${d.platform==='Windows'?'Z':'share'}"></label><p>${d.platform==='Windows'?'Для удалённой сессии ПК.':'Подключение для выбранной машины.'}</p>`;}
  else {q('.dw-dialog h3').textContent=(action==='end'?'Завершить терминал':action==='restart'?'Перезагрузить':'Выключить')+' · '+d.name;content.innerHTML='<p>'+(action==='end'?'Команда в этой сессии будет остановлена. Закрыть окно без остановки можно крестиком в его заголовке.':'Работающие программы и задачи на этой машине будут остановлены.')+'</p><p>В эскизе действие только демонстрируется.</p>';}
  q('[data-action="cancel"]').focus();
 }
 function openInput(kind){inputClose();entry=kind;q('.dw-input').hidden=false;const field=q('.dw-input input');field.type=kind==='password'?'password':'text';field.value=kind==='command'?selected().draft:'';field.setAttribute('aria-label',kind==='password'?'Пароль в эскизе':'Команда в эскизе');q('.dw-input-label').textContent=kind==='password'?'Пароль · демонстрационное поле':'Команда';field.focus();}
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.menu){showMenu(b.dataset.menu,b);return;}
  if(b.dataset.device){inputClose();state.device=b.dataset.device;closeMenu();render();save();q('.dw-machine').focus();return;}
  if(b.dataset.session){inputClose();local().selected=Number(b.dataset.session);closeMenu();render();q('.dw-session').focus();return;}
  if(b.dataset.page){inputClose();local().page=b.dataset.page;closeMenu();render();save();return;}
  const a=b.dataset.action;closeMenu();
  if(a==='collapse'){state.collapsed=!state.collapsed;render();save();(state.collapsed?q('.dw-restore'):q('.dw-system [data-action="collapse"]')).focus();}
  if(a==='refresh'){q('.dw-updated').textContent=state.offline?'Сведения 12:40':'Обновлено сейчас';notice(state.offline?'Эскиз: связи нет, последние сведения сохранены.':'Эскиз: сведения обновлены.');}
  if(a==='new'){inputClose();const l=local(),id=Math.max(...l.list.map(s=>s.id))+1;l.list.push({id,closed:false,output:'Новая сессия · '+machine().name+'\n\n$ ',draft:''});l.selected=id;render();}
  if(['help','mount','restart','shutdown','end'].includes(a))overlay(a,b);
  if(a==='cancel')closeOverlay();
  if(a==='confirm'){const action=overlayAction;if(action==='end')selected().closed=true;closeOverlay();render();notice(action==='end'?'Сессия эскиза завершена.':'Эскиз: действие подтверждено. Реальная машина не изменена.');}
  if(a==='keys'){q('.dw-extra').hidden=!q('.dw-extra').hidden;b.setAttribute('aria-expanded',String(!q('.dw-extra').hidden));}
  if(a==='input'||a==='keyboard')openInput('command');
  if(a==='password')openInput('password');
  if(a==='input-close')inputClose();
  if(a==='submit-input')submitInput();
  if(a==='paste'){q('.dw-input input').value=entry==='password'?'demo':'pwd';notice('Эскиз: вставлен пример. Буфер обмена не читался.');}
  if(b.dataset.key){notice('Эскиз: клавиша '+b.dataset.key+'. Команда не отправлена.');}
  if(a==='dismiss')q('.dw-notice').hidden=true;
  if(a==='minimize'||a==='close'){inputClose();q('.dw-notice').hidden=true;q('.dw-main').hidden=true;q('.dw-parked').hidden=false;q('.dw-parked-title').textContent=a==='minimize'?'Устройства свёрнуты':'Окно закрыто';q('[data-action="restore"]').focus();}
  if(a==='restore'){q('.dw-main').hidden=false;q('.dw-parked').hidden=true;q('.dw-machine').focus();}
 });
 function submitInput(){const field=q('.dw-input input');if(!entry||state.offline||selected().closed||!field.value.trim())return;if(entry==='command'){selected().output+='\n> '+field.value+'\n[Пример принят; выполнение отключено]\n';selected().draft='';}field.value='';render();notice(entry==='password'?'Эскиз: поле очищено. Пароль не сохранён и не отправлен.':'Эскиз: команда не выполнялась.');}
 q('.dw-input').addEventListener('submit',e=>{e.preventDefault();submitInput();});
 q('.dw-input input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitInput();}});
 root.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!q('.dw-overlay').hidden)closeOverlay();else if(menu)closeMenu(true);else if(entry){inputClose();q('[data-action="input"]').focus();}else q('.dw-notice').hidden=true;}
  if(!q('.dw-overlay').hidden&&e.key==='Tab'){const nodes=[...q('.dw-dialog').querySelectorAll('button,input,select')].filter(n=>!n.hidden&&!n.disabled);if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}
  if(e.target===q('.dw-grip')&&['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.preventDefault();state.width=e.key==='Home'?220:Math.max(180,Math.min(280,state.width+(e.key==='ArrowRight'?10:-10)));render();save();}
 });
 const grip=q('.dw-grip');grip.addEventListener('pointerdown',e=>{if(e.button!==0)return;resize={x:e.clientX,width:state.width};grip.setPointerCapture(e.pointerId);e.preventDefault();});
 grip.addEventListener('pointermove',e=>{if(!resize)return;state.width=Math.max(180,Math.min(280,resize.width+e.clientX-resize.x));q('.dw-case').style.setProperty('--dw-panel',state.width+'px');});
 grip.addEventListener('pointerup',()=>{if(resize){resize=null;render();save();}});grip.addEventListener('pointercancel',()=>{if(resize){state.width=resize.width;resize=null;render();}});
 root.addEventListener('pointerdown',e=>{if(menu&&!e.target.closest('.dw-popover')&&!e.target.closest('[data-menu]'))closeMenu();});
 function restore(snapshot){const s=snapshot?.privateContent;if(!s)return;if(['green','2000','organizer','dark'].includes(s.theme))state.theme=s.theme;if(devices[s.device])state.device=s.device;if(Number.isFinite(s.width))state.width=Math.max(180,Math.min(280,s.width));if(typeof s.collapsed==='boolean')state.collapsed=s.collapsed;if(typeof s.offline==='boolean')state.offline=s.offline;const page=snapshot?.modelContent?.view;if(['system','terminal'].includes(page))local().page=page;render();}
 render();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
 if(globalThis.Tweak){const tweak=new Tweak({container:q('.dw-case'),onChange:()=>{closeMenu();render();save();}});tweak.addSelect(state,'theme',{label:'Тема',options:[{label:'Зелёная',value:'green'},{label:'2000',value:'2000'},{label:'Органайзер',value:'organizer'},{label:'Тёмная',value:'dark'}]});tweak.addToggle(state,'offline',{label:'Показать отсутствие связи'});}
})();
</script>
