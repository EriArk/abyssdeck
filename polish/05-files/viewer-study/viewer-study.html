<div id="cw-viewer-study" class="viz-dotted-background">
  <div class="vs-case" data-theme="green">
    <header class="vs-heading">
      <i data-lucide="file-image" aria-hidden="true"></i>
      <div class="vs-title"><strong>git-workspace.png</strong><small>Результаты · CodexWeb</small></div>
      <button type="button" data-action="minimize" class="vs-wide" aria-label="Свернуть просмотр" data-tooltip="Свернуть"><i data-lucide="minus"></i></button>
      <button type="button" data-action="expand" class="vs-wide" aria-label="Развернуть просмотр" data-tooltip="Развернуть"><i data-lucide="maximize"></i></button>
      <button type="button" data-action="close" aria-label="Закрыть просмотр" data-tooltip="Закрыть"><i data-lucide="x"></i></button>
    </header>
    <div class="vs-toolbar">
      <div class="vs-group vs-file-navigation" aria-label="Файлы подборки">
        <button type="button" data-action="previous" aria-label="Предыдущий файл" data-tooltip="Предыдущий файл"><i data-lucide="chevron-left"></i></button>
        <span class="vs-file-number" aria-live="polite">1 / 3</span>
        <button type="button" data-action="next" aria-label="Следующий файл" data-tooltip="Следующий файл"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="vs-group vs-format-tools" aria-label="Инструменты формата"></div>
      <div class="vs-group vs-file-tools" aria-label="Действия с файлом">
        <button type="button" data-action="edit" aria-label="Редактировать копию" aria-pressed="false" data-tooltip="Редактировать копию"><i data-lucide="pencil"></i></button>
        <button type="button" data-action="share" aria-label="Поделиться" data-tooltip="Поделиться"><i data-lucide="share-2"></i></button>
        <button type="button" data-action="save" aria-label="Сохранить файл" data-tooltip="Сохранить файл"><i data-lucide="download"></i></button>
        <button type="button" data-action="properties" aria-label="Свойства файла" aria-pressed="false" data-tooltip="Свойства"><i data-lucide="info"></i></button>
      </div>
    </div>
    <div class="vs-mode-rail" hidden>
      <div class="vs-group" aria-label="Режим файла">
        <button type="button" data-action="view" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i>Просмотр</button>
        <button type="button" data-action="write" aria-pressed="true"><i data-lucide="pencil" aria-hidden="true"></i>Правка</button>
      </div>
      <span class="vs-draft-state" role="status">Копия · без изменений</span>
      <button type="button" data-action="saveDraft" aria-label="Сохранить копию" data-tooltip="Сохранить копию"><i data-lucide="save" aria-hidden="true"></i></button>
    </div>
    <div class="vs-body">
      <main class="vs-screen" aria-label="Содержимое файла"></main>
      <aside class="vs-properties" hidden aria-label="Свойства файла">
        <header><strong>Свойства</strong><button type="button" data-action="properties" aria-label="Закрыть свойства"><i data-lucide="x"></i></button></header>
        <dl><dt>Имя</dt><dd class="vs-prop-name"></dd><dt>Источник</dt><dd>Результаты · CodexWeb</dd><dt>Оригинал</dt><dd>Сохранённая копия</dd><dt>Формат</dt><dd class="vs-prop-format"></dd></dl>
      </aside>
    </div>
    <footer class="vs-status"><span class="vs-status-format">PNG</span><button type="button" data-action="source"><i data-lucide="message-square" aria-hidden="true"></i>К сообщению</button></footer>
    <div class="vs-popover" hidden aria-label="Действия с файлом"><strong class="vs-pop-title"></strong><p class="vs-pop-text"></p><button type="button" data-action="dismiss">Вернуться к просмотру</button></div>
  </div>
  <button type="button" class="vs-restore" hidden>Открыть просмотр · git-workspace.png</button>
</div>
<style>
#cw-viewer-study{padding:12px 0;font:14px/1.5 ui-monospace,Consolas,monospace;color:#ace9b8}
#cw-viewer-study *{box-sizing:border-box}
#cw-viewer-study .vs-case{--vs-case:#21161a;--vs-key:#2e2025;--vs-screen:#06140b;--vs-ink:#ace9b8;--vs-dim:#86ad91;--vs-edge:#345641;--vs-accent:#96ffab;--vs-paper:#0c2113;position:relative;background:var(--vs-case);color:var(--vs-ink);border:1px solid var(--vs-edge);border-radius:15px;padding:8px;box-shadow:inset 0 2px 1px #ffffff10,inset 0 -3px 2px #0009,0 8px 18px #0003;overflow:hidden}
#cw-viewer-study .vs-case[data-theme="2000"]{--vs-case:#637c76;--vs-key:#8b9a8b;--vs-screen:#ecf0db;--vs-ink:#193e37;--vs-dim:#3e6359;--vs-edge:#3e5e54;--vs-accent:#1d6e58;--vs-paper:#ffffec;font-family:Arial,sans-serif}
#cw-viewer-study .vs-case[data-theme="organizer"]{--vs-case:#ddd3bd;--vs-key:#eee5d4;--vs-screen:#fffbed;--vs-ink:#343a2f;--vs-dim:#6d715a;--vs-edge:#b0ab93;--vs-accent:#47664d;--vs-paper:#fffdf5;font-family:Georgia,serif;box-shadow:inset 5px 0 5px #44392226,0 5px 16px #0002;border-radius:5px 15px 15px 5px}
#cw-viewer-study .vs-case[data-theme="dark"]{--vs-case:#20252c;--vs-key:#303740;--vs-screen:#141a20;--vs-ink:#e1e6ea;--vs-dim:#adb7c2;--vs-edge:#46505b;--vs-accent:#b9d6c0;--vs-paper:#202932;font-family:Arial,sans-serif}
#cw-viewer-study [hidden]{display:none!important}
#cw-viewer-study button{font:inherit;color:inherit;background:var(--vs-key,#25382d);border:1px solid transparent;border-radius:5px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px}
#cw-viewer-study button:hover{border-color:var(--vs-edge);filter:brightness(1.12)}
#cw-viewer-study button[aria-pressed="true"]{background:var(--vs-screen);box-shadow:inset 0 1px 3px #0005;color:var(--vs-accent)}

#cw-viewer-study svg{width:18px;height:18px;flex-shrink:0}
#cw-viewer-study .vs-heading{display:flex;align-items:center;gap:8px;padding:5px 7px 12px}
#cw-viewer-study .vs-title{min-width:0;flex:1}
#cw-viewer-study .vs-title strong,#cw-viewer-study .vs-title small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cw-viewer-study strong{font-weight:600}
#cw-viewer-study small{font-size:11px;color:var(--vs-dim)}
#cw-viewer-study .vs-heading button{background:transparent}
#cw-viewer-study .vs-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 5px;border-top:1px solid #ffffff0d}
#cw-viewer-study .vs-group{display:flex;align-items:center;gap:3px}
#cw-viewer-study .vs-file-navigation{padding-right:7px;border-right:1px solid var(--vs-edge)}
#cw-viewer-study .vs-file-number{min-width:46px;text-align:center;font-size:12px}
#cw-viewer-study .vs-format-tools{flex:1}
#cw-viewer-study .vs-format-tools span{min-width:44px;text-align:center;font-size:12px}
#cw-viewer-study .vs-body{display:flex;min-width:0;border:1px solid var(--vs-edge);border-radius:5px;background:var(--vs-screen);box-shadow:inset 0 2px 5px #0005}
#cw-viewer-study .vs-screen{position:relative;min-width:0;flex:1;min-height:345px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;overflow:hidden}
#cw-viewer-study .vs-screen img{display:block;width:100%;height:310px;object-fit:contain;transform-origin:center;transition:transform .18s}
#cw-viewer-study .vs-sheet{width:min(100%,360px);padding:26px;background:var(--vs-paper);color:var(--vs-ink);box-shadow:0 2px 9px #0003;min-height:310px;font:15px/1.65 Georgia,serif}
#cw-viewer-study .vs-sheet h2{font:600 23px/1.25 Georgia,serif;margin:0 0 20px}
#cw-viewer-study .vs-sheet p{margin:12px 0}
#cw-viewer-study .vs-sheet footer{font:11px ui-monospace,monospace;margin-top:26px;text-align:center;color:var(--vs-dim)}
#cw-viewer-study .vs-book{max-width:510px;font:19px/1.75 Georgia,serif;color:var(--vs-ink)}
#cw-viewer-study .vs-book p{margin:10px 0 22px}
#cw-viewer-study .vs-book h2{font:600 26px/1.3 Georgia,serif;margin:0 0 20px}
#cw-viewer-study .vs-properties{flex:0 0 190px;padding:14px;border-left:1px solid var(--vs-edge);min-width:0;background:var(--vs-screen)}
#cw-viewer-study .vs-properties header{display:flex;justify-content:space-between;align-items:center}
#cw-viewer-study .vs-properties dt{font-size:11px;color:var(--vs-dim);margin-top:20px}
#cw-viewer-study .vs-properties dd{margin:3px 0;overflow-wrap:anywhere;font-size:12px}
#cw-viewer-study .vs-status{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:6px 5px 0;font-size:11px;color:var(--vs-dim)}
#cw-viewer-study .vs-status button{background:transparent;font-size:12px;min-height:36px;padding:4px}
#cw-viewer-study .vs-popover{position:absolute;inset:65px 12px auto auto;width:min(310px,calc(100% - 24px));padding:18px;background:var(--vs-case);border:1px solid var(--vs-edge);box-shadow:0 8px 25px #0006;border-radius:8px;z-index:3}
#cw-viewer-study .vs-popover p{font-size:13px}
#cw-viewer-study textarea{width:100%;height:280px;resize:vertical;font:16px/1.6 ui-monospace,monospace;background:var(--vs-paper);color:var(--vs-ink);border:1px solid var(--vs-edge);padding:12px}
#cw-viewer-study .vs-case[data-expanded="true"] .vs-screen{min-height:460px}
#cw-viewer-study .vs-mode-rail{display:flex;align-items:center;gap:8px;padding:5px;background:var(--vs-key);color:var(--vs-ink);border-radius:5px 5px 0 0}
#cw-viewer-study .vs-draft-state{flex:1;text-align:right;font-size:11px;color:var(--vs-dim)}
#cw-viewer-study .vs-format-tools{flex-wrap:wrap}
#cw-viewer-study .vs-annotation{position:relative;width:100%;max-width:510px}
#cw-viewer-study .vs-annotation>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#cw-viewer-study .vs-annotation[data-editing="false"]>svg{pointer-events:none}
#cw-viewer-study .vs-annotation path{fill:none;stroke:#ffd45c;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.5}
#cw-viewer-study .vs-annotation path[data-tool="pen"]{stroke:#ef7658;stroke-width:3;stroke-opacity:1}
#cw-viewer-study .vs-annotation .vs-sheet{width:100%;margin:auto}
#cw-viewer-study .vs-screen{transition:padding .18s;justify-content:flex-start}
#cw-viewer-study .vs-screen:has(textarea){padding:8px}
#cw-viewer-study .vs-book{align-self:stretch;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:430px){#cw-viewer-study .vs-mode-rail{flex-wrap:wrap}#cw-viewer-study .vs-draft-state{min-width:70px}#cw-viewer-study .vs-mode-rail button{font-size:12px}}
@media(max-width:650px){#cw-viewer-study .vs-wide{display:none}#cw-viewer-study .vs-toolbar{display:grid;grid-template-columns:1fr auto}#cw-viewer-study .vs-format-tools{grid-row:2;grid-column:1/-1;justify-content:center;border-top:1px solid var(--vs-edge);padding-top:6px}#cw-viewer-study .vs-file-navigation{border:0;padding:0}#cw-viewer-study .vs-body{position:relative}#cw-viewer-study .vs-properties{position:absolute;inset:0 0 0 auto;width:min(260px,100%);z-index:2;box-shadow:-5px 0 15px #0005}#cw-viewer-study .vs-screen{padding:12px;min-height:350px}#cw-viewer-study .vs-book{font-size:18px}#cw-viewer-study .vs-heading{padding-inline:3px}}
@media(prefers-reduced-motion:reduce){#cw-viewer-study *{transition:none!important}}
</style>
<script>
(()=>{
const root=document.getElementById('cw-viewer-study'),shell=root.querySelector('.vs-case'),screen=root.querySelector('.vs-screen'),tools=root.querySelector('.vs-format-tools');
const files=[{name:'git-workspace.png',format:'PNG',kind:'image'},{name:'viewer-notes.pdf',format:'PDF',kind:'document'},{name:'chapter.md',format:'MD',kind:'book'}];
let draftText=null;
const sessions=files.map(()=>({active:false,dirty:false,marks:{},redo:{},tool:'marker'}));
const textHistory=[],textRedo=[];
let textSelection=[0,0],textScroll=0;
const settings={theme:'green'},state={index:0,zoom:100,page:1,properties:false,source:false,editing:false};
const saved=window.openai?.widgetState?.privateContent;
if(saved&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<3)state.index=saved.index;
if(['green','2000','organizer','dark'].includes(saved?.theme))settings.theme=saved.theme;
const icon=(action,label,name)=>`<button type="button" class="cursor-interaction" data-action="${action}" aria-label="${label}" data-tooltip="${label}"><i data-lucide="${name}" aria-hidden="true"></i></button>`;
const bookText='Глава первая\n\nК вечеру мастерская опустела. На столе остались чертежи, карандаш и маленький экран с последней открытой страницей.\n\nОн убрал лишние инструменты. Теперь ничто не отвлекало от самой работы.';
function remember(){window.openai?.setWidgetState?.({modelContent:{viewerFormat:files[state.index].format,theme:settings.theme,properties:state.properties},privateContent:{index:state.index,theme:settings.theme}})?.catch(()=>{});}
function popover(title,text){root.querySelector('.vs-pop-title').textContent=title;root.querySelector('.vs-pop-text').textContent=text;root.querySelector('.vs-popover').hidden=false;}
function editText(action){
 const input=screen.querySelector('textarea');if(!input)return;
 const before=input.value,from=input.selectionStart,to=input.selectionEnd,selected=before.slice(from,to);
 if(action==='undo'){if(!textHistory.length)return;textRedo.push(before);draftText=textHistory.pop();}
 else if(action==='redo'){if(!textRedo.length)return;textHistory.push(before);draftText=textRedo.pop();}
 else{
  const wrappers={bold:['**','**'],italic:['_','_'],link:['[','](https://)'],code:['`','`']};
  const pair=wrappers[action];
  const insert=pair?pair[0]+(selected||'текст')+pair[1]:({heading:'## ',list:'- ',check:'- [ ] '}[action]||'')+(selected||'текст');
  textHistory.push(before);textRedo.length=0;draftText=before.slice(0,from)+insert+before.slice(to);textSelection=[from,from+insert.length];
 }
 sessions[state.index].dirty=true;render();screen.querySelector('textarea')?.focus();
}
function renderMode(f){
 const s=sessions[state.index],rail=root.querySelector('.vs-mode-rail');
 rail.hidden=!s.active;
 root.querySelector('[data-action="edit"]').hidden=s.active;
 root.querySelector('[data-action="view"]').setAttribute('aria-pressed',String(!state.editing));
 root.querySelector('[data-action="write"]').setAttribute('aria-pressed',String(state.editing));
 root.querySelector('.vs-draft-state').textContent='Копия · '+(s.dirty?'изменена':'без изменений');
 if(f.kind==='book'&&s.active&&!state.source&&!state.editing){
  screen.innerHTML='<article class="vs-book"></article>';screen.querySelector('article').textContent=draftText??bookText;
 }
 if(f.kind==='book'&&state.editing){
  tools.innerHTML=icon('heading','Заголовок','heading-2')+icon('bold','Полужирный','bold')+icon('italic','Курсив','italic')+icon('list','Список','list')+icon('check','Задача','list-checks')+icon('link','Ссылка','link')+icon('code','Код','code')+icon('undo','Отменить изменение','undo-2')+icon('redo','Повторить изменение','redo-2');
  const input=screen.querySelector('textarea');input.value=draftText??bookText;
  input.setSelectionRange(...textSelection);input.scrollTop=textScroll;
  input.onselect=()=>{textSelection=[input.selectionStart,input.selectionEnd];};
  input.onscroll=()=>{textScroll=input.scrollTop;};
  input.oninput=()=>{textHistory.push(draftText??bookText);textRedo.length=0;draftText=input.value;s.dirty=true;root.querySelector('.vs-draft-state').textContent='Копия · изменена';};
 }
 if(f.kind!=='book'){
  const key=f.kind==='document'?state.page:0,marks=s.marks[key]??=[];
  const wrapper=document.createElement('div');wrapper.className='vs-annotation';wrapper.dataset.editing=String(state.editing);
  while(screen.firstChild)wrapper.append(screen.firstChild);screen.append(wrapper);
  const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 500 340');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('role','img');svg.setAttribute('aria-label','Разметка копии');
  const paint=mark=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',mark.d);p.dataset.tool=mark.tool;svg.append(p);return p;};
  marks.forEach(paint);wrapper.append(svg);
  if(state.editing){
   tools.innerHTML=icon('marker','Маркер','highlighter')+icon('pen','Перо','pencil')+icon('undo','Отменить изменение','undo-2')+icon('redo','Повторить изменение','redo-2')+(f.kind==='document'?icon('pagePrevious','Предыдущая страница','chevron-left')+`<span>${state.page} / 4</span>`+icon('pageNext','Следующая страница','chevron-right'):'');
   tools.querySelector(`[data-action="${s.tool}"]`).setAttribute('aria-pressed','true');
   tools.querySelector('[data-action="undo"]').disabled=!marks.length;tools.querySelector('[data-action="redo"]').disabled=!(s.redo[key]?.length);
   let drawing=null,path=null;
   const point=e=>{const r=svg.getBoundingClientRect();return `${Math.max(0,Math.min(500,(e.clientX-r.left)*500/r.width)).toFixed(1)} ${Math.max(0,Math.min(340,(e.clientY-r.top)*340/r.height)).toFixed(1)}`;};
   svg.onpointerdown=e=>{if(e.button!==0||drawing)return;e.preventDefault();svg.setPointerCapture(e.pointerId);drawing={tool:s.tool,d:'M '+point(e)};path=paint(drawing);};
   svg.onpointermove=e=>{if(!drawing)return;drawing.d+=' L '+point(e);path.setAttribute('d',drawing.d);};
   svg.onpointerup=e=>{if(!drawing)return;drawing.d+=' L '+point(e);marks.push(drawing);s.redo[key]=[];s.dirty=true;drawing=null;render();};
   svg.onpointercancel=()=>{path?.remove();drawing=null;};
  }
 }
}
function render(){
 const f=files[state.index];shell.dataset.theme=settings.theme;
 root.querySelector('.vs-title strong').textContent=f.name;
 root.querySelector('.vs-file-number').textContent=`${state.index+1} / ${files.length}`;
 root.querySelector('[data-action="previous"]').disabled=state.index===0;root.querySelector('[data-action="next"]').disabled=state.index===files.length-1;
 root.querySelector('.vs-properties').hidden=!state.properties;root.querySelector('.vs-prop-name').textContent=f.name;root.querySelector('.vs-prop-format').textContent=f.format;
 root.querySelector('.vs-file-tools [data-action="properties"]').setAttribute('aria-pressed',String(state.properties));
 root.querySelector('.vs-status-format').textContent=state.editing?'Копия · черновик':f.format+(f.kind==='image'?' · 1366 × 1000':'');
