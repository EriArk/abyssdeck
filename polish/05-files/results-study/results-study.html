<div id="cw-results-study" class="viz-dotted-background">
  <section class="rs-case" data-theme="green" aria-label="Результаты CodexWeb">
    <div class="rs-feed">
      <header class="rs-header">
        <i data-lucide="bookmark" aria-hidden="true"></i>
        <div class="rs-heading"><h2>Результаты</h2><span>CodexWeb · текущий диалог</span></div>
        <button type="button" class="rs-key cursor-interaction" data-action="select" aria-label="Выбрать несколько" data-tooltip="Выбрать несколько" aria-pressed="false"><i data-lucide="list-checks" aria-hidden="true"></i></button>
        <button type="button" class="rs-key cursor-interaction" data-action="search" aria-label="Поиск результатов" data-tooltip="Поиск результатов"><i data-lucide="search" aria-hidden="true"></i></button>
      </header>
      <nav class="rs-categories" aria-label="Категории результатов">
        <button type="button" class="cursor-interaction" data-category="files" aria-pressed="true">Файлы <span>5</span></button>
        <button type="button" class="cursor-interaction" data-category="images" aria-label="Изображения" data-tooltip="Изображения" aria-pressed="false"><i class="rs-narrow-image" data-lucide="image" aria-hidden="true"></i><b class="rs-image-label">Изображения</b> <span>2</span></button>
        <button type="button" class="cursor-interaction" data-category="reasoning" aria-pressed="false">Рассуждения</button>
        <div class="rs-more-wrap"><button type="button" class="rs-key cursor-interaction" data-action="categories" aria-label="Другие категории" data-tooltip="Ссылки и демо" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button><div class="rs-category-menu rs-popover" hidden></div></div>
      </nav>
      <div class="rs-screen">
        <div class="rs-batch" hidden>
          <div class="rs-batch-head"><strong class="rs-selected-count" aria-live="polite"></strong><button type="button" class="cursor-interaction" data-action="select">Готово</button></div>
          <div class="rs-batch-tools">
            <button type="button" class="rs-key cursor-interaction" data-action="all" aria-label="Выбрать загруженные" data-tooltip="Выбрать загруженные"><i data-lucide="check-check" aria-hidden="true"></i></button>
            <button type="button" class="rs-key cursor-interaction" data-action="clear" aria-label="Снять выбор" data-tooltip="Снять выбор"><i data-lucide="square" aria-hidden="true"></i></button>
            <button type="button" class="cursor-interaction" data-action="package">Подготовить пакет</button>
          </div>
        </div>
        <div class="rs-section-label"><span class="rs-section-name">Сегодня</span><span class="rs-count">5 файлов</span></div>
        <div class="rs-items"></div>
      </div>
      <footer class="rs-footer"><span>Материалы текущего диалога</span></footer>
    </div>
    <section class="rs-layer rs-search" aria-label="Поиск результатов" hidden>
      <header class="rs-header"><i data-lucide="search" aria-hidden="true"></i><div class="rs-heading"><h2>Поиск результатов</h2></div><button type="button" class="rs-key cursor-interaction" data-action="close-search" aria-label="Закрыть поиск"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <div class="rs-search-fields"><input type="search" aria-label="Название результата" placeholder="Название файла или изображения"><div><select aria-label="Тип результата"><option value="all">Все материалы</option><option value="files">Файлы</option><option value="images">Изображения</option></select><select aria-label="Порядок результатов"><option value="new">Сначала новые</option><option value="name">По имени</option><option value="old">Сначала старые</option></select></div></div>
      <div class="rs-screen rs-search-results"></div>
    </section>
    <section class="rs-layer rs-viewer" aria-label="Просмотр результата" hidden>
      <header class="rs-header"><i data-lucide="file" aria-hidden="true"></i><div class="rs-heading"><h2 class="rs-viewer-name"></h2><span>Сохранённый результат</span></div><button type="button" class="rs-key cursor-interaction" data-action="close-viewer" aria-label="Закрыть просмотр"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <div class="rs-viewer-tools"></div><div class="rs-viewer-content rs-screen"></div>
    </section>
    <div class="rs-notice" role="status" hidden></div>
  </section>
</div>

<script>
(() => {
  const root = document.getElementById('cw-results-study');
  const el = s => root.querySelector(s);

    {id:'organizer', type:'images', name:'Файлы · органайзер', format:'PNG', size:'96 КБ', time:'14:29', icon:'image', image:1},
  ];
  const sections = {files:'Файлы',images:'Изображения',links:'Ссылки',demos:'HTML-демо',reasoning:'Рассуждения'};
  const extra = [
    {id:'link',type:'links',name:'Обсуждение интерфейса',format:'GitHub · Issue',time:'14:25',icon:'link',text:'Предложение по компактной панели действий. Ссылка на исходное обсуждение.'},
    {id:'demo',type:'demos',name:'Эскиз результатов',format:'HTML-демо',time:'14:24',icon:'panels-top-left',text:'Интерактивное предложение по компоновке результатов.'},
    {id:'check',type:'work',name:'Проверка компоновки',format:'Проверка',time:'14:21',icon:'check',text:'Chromium и WebKit\nТелефонная и широкая компоновки\nОбразец записи хода работы.'},
    {id:'command',type:'work',name:'Сборка веб-приложения',format:'Команда',time:'14:18',icon:'terminal',text:'pnpm --filter @codex-web/web build\nОбразец вывода команды.'},
    {id:'thinking',type:'reasoning',name:'Выбор структуры панели',format:'Рассуждения',time:'14:16',icon:'notebook-text',text:'Сопоставление компактных строк файлов и миниатюр изображений.'},
  ];
  const state = {theme:'green',category:'files',selecting:false,selected:[],query:'',searchType:'all',sort:'new',expanded:[]};
  let opened = null, returnFocus = null, searchFocus = null;
  function reasoningPath() {
    const expansion=id=>`data-expansion="${id}" ${state.expanded.includes(id)?'open':''}`;
    const task=(id,glyph,title,body)=>`<details class="rs-task" ${expansion(id)}><summary class="cursor-interaction">${icon(glyph)}<span>${title}</span>${icon('chevron-down')}</summary><div class="rs-task-body">${body}</div></details>`;
    const card=(id,time,request,count,steps)=>`<article class="rs-request"><div class="rs-request-head"><span>Вы · ${time}</span>${key('share','Отправить','share-2','thinking')}${key('source','К сообщению','message-square','thinking')}</div><p class="rs-request-text">${request}</p><details class="rs-request-details" ${expansion(id)}><summary class="cursor-interaction">${icon('notebook-text')}<span>Рассуждения · ${count}</span>${icon('chevron-down')}</summary><ol class="rs-path" aria-label="Ход запроса">${steps}</ol></details></article>`;
    return card('toolbar','14:14','В файлах кнопки в два ряда. Собери их в один, чтобы для самого файла оставалось больше места.','3 шага',`
      <li class="rs-step"><time>14:16</time><p>Проверю, почему действия файла и инструменты текста занимают два отдельных ряда.</p>${task('toolbar-read','files','Изучены исходники · 2 файла','<p>ProjectFiles.tsx</p><p>ReadableFilePreview.tsx</p>')}</li>
      <li class="rs-step"><time>14:18</time><p>У двух рядов разные владельцы. Соберу действия в общую панель, сохранив состояние просмотра.</p>${task('toolbar-edit','file-pen-line','Изменения · 2 файла','<p>ProjectFiles.tsx — общее место для действий</p><p>project-files.css — компактный ряд</p>')}</li>
      <li class="rs-step"><time>14:21</time><p>Проверю ширину кнопок и возврат из вложенного просмотра.</p>${task('toolbar-check','check-check','Проверки · 2 выполнены','<p>Chromium · пройдено</p><p>WebKit · пройдено</p><pre>390 / 768 / 1366 px\nКнопки: 44 × 44 px\nСостояние просмотра сохранено</pre>')}</li>
    `)+card('screenshots','13:52','Сохрани снимки файлового менеджера во всех темах и положи описания рядом.','1 шаг',`<li class="rs-step"><time>13:54</time><p>Сниму телефонную и широкую компоновки, затем добавлю описание к каждому снимку.</p>${task('screenshots-save','files','Сохранены снимки и описания','<p>polish/05-files/preview-toolbar/</p><p>Четыре темы · PNG и Markdown</p>')}</li>`);
  }
  function icons() { if (globalThis.lucide) lucide.createIcons({attrs:{width:19,height:19}}); }
  function key(action,name,glyph,id='',extraClass='') { return `<button type="button" class="rs-key cursor-interaction ${extraClass}" data-action="${action}" data-id="${id}" aria-label="${escape(name)}" data-tooltip="${escape(name)}">${icon(glyph)}</button>`; }
  function actions(r) { return `<div class="rs-actions">${key('share','Отправить','share-2',r.id)}${key('download','Скачать','download',r.id)}${key('source','К сообщению','message-square',r.id)}${key('menu','Действия с результатом','ellipsis',r.id,'rs-overflow')}<div class="rs-popover rs-item-menu" hidden>${[['share','Отправить','share-2'],['download','Скачать','download'],['source','К сообщению','message-square']].map(([action,name,glyph])=>`<button type="button" class="cursor-interaction" data-action="${action}" data-id="${r.id}">${icon(glyph)}${name}</button>`).join('')}</div></div>`; }
  function checkbox(r) { return state.selecting ? `<label class="rs-check cursor-interaction"><input type="checkbox" data-id="${r.id}" aria-label="Выбрать ${escape(r.name)}" ${state.selected.includes(r.id)?'checked':''}></label>` : ''; }
  function row(r,search=false) { return `<div class="rs-row" data-record="${r.id}">${search?'':checkbox(r)}<button type="button" class="rs-open cursor-interaction" data-action="open" data-id="${r.id}" data-tooltip="${escape(r.name)}" aria-label="Открыть ${escape(r.name)}">${icon(r.icon)}<span class="rs-name-block"><span class="rs-name">${escape(r.name)}</span><span class="rs-meta">${r.format} · ${r.size} · ${r.time}</span></span></button>${search?'':actions(r)}</div>`; }
  function save() { window.openai?.setWidgetState?.({modelContent:{proposal:'Results with expandable request cards',theme:state.theme,density:'roomy tablet, compact phone',category:state.category},privateContent:{...state}})?.catch(()=>{}); }
  function render() {
    el('.rs-case').dataset.theme=state.theme;
    root.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===state.category)));
    el('[data-action="select"]').setAttribute('aria-pressed',String(state.selecting));
    el('.rs-batch').hidden=!state.selecting;
    el('.rs-selected-count').textContent=`Выбрано: ${state.selected.length}`;
    el('[data-action="package"]').disabled=!state.selected.length;
    el('[data-action="clear"]').disabled=!state.selected.length;
    const list=records.filter(r=>r.type===state.category), services=extra.filter(r=>r.type===state.category);
    el('.rs-section-name').textContent=['files','images'].includes(state.category)?'Сегодня':sections[state.category];
    el('.rs-count').textContent=state.category==='files'?'5 файлов':state.category==='images'?'2 изображения':state.category==='reasoning'?'Сегодня · 2 запроса':`${services.length} ${services.length===1?'запись':'записи'}`;
    el('.rs-items').classList.toggle('rs-images',state.category==='images');
    el('.rs-items').innerHTML=state.category==='images'?list.map(r=>`<div class="rs-image" data-record="${r.id}"><button type="button" class="rs-open cursor-interaction" data-action="open" data-id="${r.id}" aria-label="Открыть ${escape(r.name)}" data-tooltip="${escape(r.name)}"><img class="rs-thumb" src="${images[r.image]}" alt="${escape(r.name)}"><span class="rs-name">${escape(r.name)}</span><span class="rs-meta">${r.format} · ${r.size}</span></button><div class="rs-image-bottom">${checkbox(r)}${actions(r)}</div></div>`).join(''):list.length?list.map(r=>row(r)).join(''):services.map(r=>`<details class="rs-service"><summary class="cursor-interaction">${icon(r.icon)}<span>${r.name}<span class="rs-meta">${r.format} · ${r.time}</span></span>${icon('chevron-down')}</summary><p>${escape(r.text)}</p><button type="button" class="cursor-interaction" data-action="source" data-id="${r.id}">${icon('message-square')}К сообщению</button></details>`).join('');
    if(state.category==='reasoning')el('.rs-items').innerHTML=reasoningPath();
    el('.rs-category-menu').innerHTML=['links','demos'].map(type=>`<button type="button" class="cursor-interaction" data-category="${type}" aria-pressed="${state.category===type}">${icon({links:'link',demos:'panels-top-left'}[type])}${sections[type]}</button>`).join('');
    icons();
  }
  function searchResults() {
    const results=records.filter(r=>(state.searchType==='all'||r.type===state.searchType)&&r.name.toLocaleLowerCase('ru').includes(state.query.toLocaleLowerCase('ru')));
    if(state.sort==='name')results.sort((a,b)=>a.name.localeCompare(b.name,'ru'));else if(state.sort==='old')results.reverse();
    el('.rs-search-results').innerHTML=results.length?results.map(r=>row(r,true)).join(''):'<p>Ничего не найдено</p>';
    icons();
  }
  function notice(message) {
    el('.rs-notice').innerHTML=`<span>${escape(message)}</span>${key('dismiss','Закрыть уведомление','x')}`;
    el('.rs-notice').hidden=false;icons();
  }
  function closeMenus() { root.querySelectorAll('.rs-popover').forEach(e=>e.hidden=true);el('[data-action="categories"]').setAttribute('aria-expanded','false'); }
  function viewer(id) {
    opened=records.find(r=>r.id===id);if(!opened)return;
    el('.rs-feed').inert=true;el('.rs-search').inert=true;el('.rs-viewer').hidden=false;
    el('.rs-viewer-name').textContent=opened.name;
    const gallery=opened.type==='images',index=records.filter(r=>r.type==='images').findIndex(r=>r.id===opened.id);
    el('.rs-viewer-tools').innerHTML=(gallery?`${key('previous','Предыдущее изображение','chevron-left')}<span class="rs-counter">${index+1} из 2</span>${key('next','Следующее изображение','chevron-right')}`:'<span class="rs-counter">Просмотр</span>')+key('source','К сообщению','message-square',id)+key('download','Скачать','download',id);
    if(gallery){el('[data-action="previous"]').disabled=index===0;el('[data-action="next"]').disabled=index===1;}
    el('.rs-viewer-content').innerHTML=gallery?`<img src="${images[opened.image]}" alt="${escape(opened.name)}">`:opened.id==='review'?'<h3>Разбор интерфейса</h3><p>Файлы — компактным списком.<br>Изображения — миниатюрами.</p><p>Название открывает общий просмотрщик. Действия и переход к исходному сообщению остаются рядом с материалом.</p>':`<h3>${escape(opened.name)}</h3><p>${opened.format} · ${opened.size}</p><p>Общий просмотрщик · сохранённая копия</p>`;
    icons();
  }
  function closeViewer(){el('.rs-viewer').hidden=true;el('.rs-search').inert=false;el('.rs-feed').inert=!el('.rs-search').hidden;opened=null;returnFocus?.focus();}
  function closeSearch(){el('.rs-search').hidden=true;el('.rs-feed').inert=false;searchFocus?.focus();}
  root.addEventListener('click', e=>{
    const b=e.target.closest('button');if(!b)return;
    const type=b.dataset.category;
    if(type){state.category=type;closeMenus();render();save();return;}
    const action=b.dataset.action,id=b.dataset.id;
    if(action!=='menu'&&action!=='categories')closeMenus();
    if(action==='categories'){const m=el('.rs-category-menu'),show=m.hidden;closeMenus();m.hidden=!show;b.setAttribute('aria-expanded',String(show));}
    if(action==='menu'){const m=b.parentElement.querySelector('.rs-item-menu'),show=m.hidden;closeMenus();m.hidden=!show;}
    if(action==='select'){state.selecting=!state.selecting;if(!state.selecting)state.selected=[];render();save();}
    if(action==='all'){state.selected=[...new Set([...state.selected,...records.filter(r=>r.type===state.category).map(r=>r.id)])];render();save();}
    if(action==='clear'){state.selected=[];render();save();}
    if(action==='open'){returnFocus=b;viewer(id);el('[data-action="close-viewer"]').focus();}
    if(action==='close-viewer')closeViewer();
    if(action==='previous'||action==='next'){const gallery=records.filter(r=>r.type==='images'),i=gallery.findIndex(r=>r.id===opened.id);viewer(gallery[i+(action==='next'?1:-1)].id);}
    if(action==='search'){searchFocus=b;el('.rs-search').hidden=false;el('.rs-feed').inert=true;searchResults();el('input[type="search"]').focus();}
    if(action==='close-search')closeSearch();
    if(action==='dismiss')el('.rs-notice').hidden=true;
    if(action==='package')notice(`Эскиз: подготовка пакета из ${state.selected.length} файлов.`);
    if(['share','download','source'].includes(action)){const r=[...records,...extra].find(r=>r.id===id);notice(`Эскиз: ${ {share:'отправка',download:'скачивание',source:'переход к сообщению'}[action]} «${r.name}».`);}
  });
  root.addEventListener('input',e=>{if(e.target.matches('input[type="search"]')){state.query=e.target.value;searchResults();save();}});
  root.addEventListener('change',e=>{
    if(e.target.matches('input[type="checkbox"]')){const id=e.target.dataset.id;state.selected=e.target.checked?[...state.selected,id]:state.selected.filter(x=>x!==id);el('.rs-selected-count').textContent=`Выбрано: ${state.selected.length}`;el('[data-action="package"]').disabled=!state.selected.length;el('[data-action="clear"]').disabled=!state.selected.length;save();}
    if(e.target.matches('select')){state[e.target.getAttribute('aria-label')==='Тип результата'?'searchType':'sort']=e.target.value;searchResults();save();}
  });
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!el('.rs-notice').hidden)el('.rs-notice').hidden=true;else if(!el('.rs-viewer').hidden)closeViewer();else if(!el('.rs-search').hidden)closeSearch();else closeMenus();}});
  root.addEventListener('toggle',e=>{const d=e.target;if(!d.isConnected||!d.matches('details[data-expansion]'))return;const id=d.dataset.expansion;if(d.open&&!state.expanded.includes(id)){state.expanded.push(id);save();}else if(!d.open&&state.expanded.includes(id)){state.expanded=state.expanded.filter(x=>x!==id);save();}},true);
  function restore(snapshot){const s=snapshot?.privateContent;if(!s)return;for(const k of ['theme','category','query','searchType','sort'])if(typeof s[k]==='string')state[k]=s[k];if(!['green','2000','organizer','dark'].includes(state.theme))state.theme='green';if(!sections[state.category])state.category='files';state.expanded=Array.isArray(s.expanded)?s.expanded.filter(x=>typeof x==='string').slice(0,6):[];state.selecting=!!s.selecting;state.selected=Array.isArray(s.selected)?s.selected.filter(id=>records.some(r=>r.id===id)):[];el('input[type="search"]').value=state.query;el('[aria-label="Тип результата"]').value=state.searchType;el('[aria-label="Порядок результатов"]').value=state.sort;render();if(!el('.rs-search').hidden)searchResults();}
  render();restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  if(globalThis.Tweak){const tweak=new Tweak({container:el('.rs-case'),onChange:()=>{render();save();}});tweak.addSelect(state,'theme',{label:'Тема',options:[{label:'Зелёная',value:'green'},{label:'2000',value:'2000'},{label:'Органайзер',value:'organizer'},{label:'Тёмная',value:'dark'}]});}
})();
</script>
