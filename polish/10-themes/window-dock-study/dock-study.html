<script>
(() => {
  const root = document.getElementById('cw-dock-study');
  const template = root.querySelector('template');
  for (const variant of root.querySelectorAll('[data-variant]')) {
    variant.append(template.content.cloneNode(true));
    const app = variant.querySelector('.dc-app');
    const dock = app.querySelector('.dc-dock'), tab = app.querySelector('.dc-tab');
    const windows = [...app.querySelectorAll('[data-window]')];
    const status = new Map(windows.map(w => [w.dataset.window, 'minimized']));
    let folded = false, layer = 20;
    function announce(text) { app.querySelector('.dc-announcement').textContent = text; }
    function draw() {
      const count = [...status.values()].filter(s => s === 'minimized').length;
      dock.hidden = !count || folded;
      tab.hidden = !count || !folded;
      tab.querySelector('span').textContent = count;
      tab.setAttribute('aria-label', 'Развернуть док: ' + count + ' окна');
      app.querySelectorAll('[data-restore]').forEach(b => b.hidden = status.get(b.dataset.restore) !== 'minimized');
      windows.forEach(w => w.hidden = status.get(w.dataset.window) !== 'open');
    }
    function open(id) {
      const w = windows.find(w => w.dataset.window === id);
      if (!w) return;
      // Keep the same mounted nodes, draft, scroll and bounds across minimize/restore.
      status.set(id, 'open'); w.style.zIndex = ++layer; draw();
      w.querySelector('.dc-close').focus({preventScroll:true});
      announce('Восстановлено: ' + w.getAttribute('aria-label'));
    }
    app.querySelectorAll('[data-open],[data-restore]').forEach(b => b.addEventListener('click', () => open(b.dataset.open || b.dataset.restore)));
    app.querySelector('.dc-fold').onclick = () => { folded = true; draw(); tab.focus({preventScroll:true}); };
    tab.onclick = () => { folded = false; draw(); dock.querySelector('button:not([hidden])').focus({preventScroll:true}); };
    app.querySelectorAll('[data-project]').forEach(b => b.onclick = () => {
      app.querySelector('[data-project-title]').textContent = b.dataset.project;
      app.querySelectorAll('[data-project]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    });
    function drag(handle, read, update) {
      let origin;
      handle.addEventListener('pointerdown', e => {
        if (e.button !== 0 || (handle.classList.contains('dc-window-head') && e.target.closest('button')) || app.clientWidth < 590) return;
        e.preventDefault(); origin = { x: e.clientX, y: e.clientY, value: read() };
        handle.setPointerCapture(e.pointerId);
      });
      handle.addEventListener('pointermove', e => { if (origin) update(origin.value, e.clientX-origin.x, e.clientY-origin.y); });
      const end = e => { origin = null; if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId); };
      handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
    }
    for (const w of windows) {
      const id = w.dataset.window;
      const returnFocus = () => { const button = app.querySelector('[data-restore="'+id+'"]'); if (!folded && !button.hidden && app.clientWidth > 590) button.focus({preventScroll:true}); else app.querySelector('[data-open="'+id+'"]').focus({preventScroll:true}); };
      w.querySelector('.dc-minimize').onclick = () => { status.set(id,'minimized'); draw(); returnFocus(); announce('Свёрнуто: '+w.getAttribute('aria-label')); };
      w.querySelector('.dc-close').onclick = () => { status.set(id,'closed'); draw(); app.querySelector('[data-open="'+id+'"]').focus({preventScroll:true}); };
      let saved;
      w.querySelector('.dc-maximize').onclick = () => {
        const b = w.querySelector('.dc-maximize');
        if (saved) { for (const [k,v] of Object.entries(saved)) w.style[k]=v; saved=null; b.setAttribute('aria-label','Развернуть '+w.querySelector('strong').textContent); }
        else { saved={left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height}; Object.assign(w.style,{left:'14px',top:'14px',width:(app.clientWidth-28)+'px',height:(app.clientHeight-28)+'px'}); b.setAttribute('aria-label','Вернуть размер '+w.querySelector('strong').textContent); }
      };
      const bounds = () => ({x:w.offsetLeft,y:w.offsetTop,width:w.offsetWidth,height:w.offsetHeight});
      drag(w.querySelector('.dc-window-head'), bounds, (v,x,y) => { if(saved)return; w.style.left=Math.max(4,Math.min(app.clientWidth-v.width-4,v.x+x))+'px'; w.style.top=Math.max(4,Math.min(app.clientHeight-v.height-4,v.y+y))+'px'; });
      drag(w.querySelector('.dc-resize'), bounds, (v,x,y) => { if(saved)return; w.style.width=Math.min(app.clientWidth-v.x-4,Math.max(330,v.width+x))+'px'; w.style.height=Math.min(app.clientHeight-v.y-4,Math.max(270,v.height+y))+'px'; });
      w.addEventListener('pointerdown', () => w.style.zIndex=++layer);
    }
    const divider = app.querySelector('.dc-divider');
    function navWidth(value) { const n=Math.min(270,Math.max(150,Math.min(app.clientWidth-430,value)));app.style.setProperty('--dc-nav',n+'px');divider.setAttribute('aria-valuenow',Math.round(n)); }
    drag(divider, () => app.querySelector('.dc-nav').offsetWidth, (v,x) => navWidth(v+x));
    divider.onkeydown = e => { if(['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.preventDefault();navWidth(e.key==='Home'?190:app.querySelector('.dc-nav').offsetWidth+(e.key==='ArrowRight'?10:-10));} };
    app.querySelectorAll('.dc-file-body nav button').forEach(b => b.onclick = () => {
      app.querySelectorAll('.dc-file-body nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      app.querySelector('.dc-document h2').textContent = b.textContent === 'UI_LAYOUT_RULES.md' ? 'Рабочее пространство' : b.textContent === 'DECISIONS.md' ? 'Решения по интерфейсу' : 'Текущий статус';
    });
    draw();
    if(globalThis.Tweak){const settings={top:92};const tweak=new Tweak({container:app, onChange:()=>{dock.style.top=settings.top+'px';tab.style.top=(settings.top+12)+'px';}});tweak.addSlider(settings,'top',{label:'Положение дока по высоте',min:82,max:180,unit:'px'});}
  }
  if(globalThis.lucide) lucide.createIcons({attrs:{width:20,height:20}});
})();
</script>
