<div id="cw-git-study" class="viz-dotted-background">
  <section class="gs-case" data-theme="green" aria-label="Предложение окна Git">
    <header class="gs-head">
      <i data-lucide="git-branch" aria-hidden="true"></i>
      <div class="gs-title"><strong>Git · CodexWeb</strong><small>Мой компьютер · рабочая копия</small></div>
      <button data-action="files" class="gs-key" aria-label="Файлы репозитория" data-tooltip="Открыть общий файловый менеджер"><i data-lucide="folder-open" aria-hidden="true"></i></button>
      <button data-action="info" class="gs-key" aria-label="О репозитории" data-tooltip="О репозитории"><i data-lucide="info" aria-hidden="true"></i></button>
    </header>
    <div class="gs-source">
      <button data-tab="branches" class="gs-branch"><i data-lucide="git-branch" aria-hidden="true"></i><span>main</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
      <span class="gs-sync">origin/main · <span data-ahead>1</span> к отправке</span>
      <button data-action="push" class="gs-key" aria-label="Отправить коммиты" data-tooltip="Отправить коммиты в origin/main"><i data-lucide="upload" aria-hidden="true"></i></button>
    </div>
    <nav class="gs-tabs" aria-label="Раздел Git">
      <button data-tab="changes" aria-pressed="true">Изменения <span data-count>3</span></button>
      <button data-tab="history" aria-pressed="false">История</button>
      <button data-tab="branches" aria-pressed="false">Ветки</button>
      <button data-tab="releases" aria-pressed="false">Релизы</button>
    </nav>
    <div class="gs-main" data-view="changes">
      <aside class="gs-list">
        <div class="gs-list-label"><span data-list-heading>Рабочая копия</span><small data-list-count>3 файла</small></div>
        <div data-items></div>
        <div class="gs-commit">
          <label for="gs-message">Описание коммита</label>
          <textarea id="gs-message" rows="3" placeholder="Что изменилось?">Уточнить движение панелей</textarea>
          <small data-selection>Выбрано 2 из 3</small>
          <button class="gs-primary" type="button"><i data-lucide="git-commit-horizontal" aria-hidden="true"></i>Проверить коммит</button>
        </div>
      </aside>
      <button class="gs-split" role="separator" aria-label="Ширина списка" aria-orientation="vertical" aria-valuemin="190" aria-valuemax="360" aria-valuenow="230" data-tooltip="Изменить ширину списка"></button>
      <article class="gs-detail">
        <header class="gs-detail-head">
          <button data-action="back" class="gs-key gs-phone-back" aria-label="К списку"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <div class="gs-title"><strong data-detail-title>workspace-panels.css</strong><small data-detail-path>apps/web/src</small></div>
          <button data-action="diff-mode" class="gs-key" aria-label="Показать до и после рядом" data-tooltip="Рядом / одним списком"><i data-lucide="columns-2" aria-hidden="true"></i></button>
        </header>
        <div data-detail-content></div>
      </article>
    </div>
    <footer class="gs-foot"><span data-notice aria-live="polite">Макет · пример данных</span><span>Git → Файлы</span></footer>
    <section class="gs-review" aria-label="Просмотр операции" hidden>
      <header class="gs-head"><strong data-review-title>Проверить коммит</strong><button data-action="review-close" class="gs-key" aria-label="Закрыть проверку"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <div data-review-body></div>
      <div class="gs-review-actions"><button data-action="review-close">Вернуться</button><button data-action="review-confirm" class="gs-primary">Создать коммит</button></div>
    </section>
    <section class="gs-files" aria-label="Существующий общий файловый менеджер" hidden>
      <header class="gs-head"><div class="gs-title"><strong>Файлы · общий модуль</strong><small>Снимок действующего окна на тестовых данных</small></div><button data-action="files-close" class="gs-key" aria-label="Вернуться в Git"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <img data-files-image alt="Существующий файловый менеджер: расположения, узкий список, общий просмотрщик. Это снимок, а не отдельная реализация файлов для Git.">
    </section>
  </section>
</div>
<style>

#cw-git-study .gs-split{position:relative;padding:0;box-shadow:none;background:var(--gs-case);border:0;border-radius:0;touch-action:none;cursor:col-resize}#cw-git-study .gs-split:after{content:"";position:absolute;width:3px;height:34px;left:3px;top:45%;border-radius:3px;background:var(--gs-shine)}#cw-git-study .gs-detail{min-width:0;padding:0 5px 14px}#cw-git-study .gs-detail-head{display:flex;gap:8px;align-items:center;padding:11px 9px;border-bottom:1px solid var(--gs-line)}#cw-git-study .gs-detail-head strong{font-size:13px}#cw-git-study .gs-detail-head small{font-size:11px}#cw-git-study .gs-detail .gs-key{background:var(--gs-screen);color:var(--gs-ink);box-shadow:none;border-color:var(--gs-line)}#cw-git-study .gs-phone-back{display:none}
#cw-git-study .gs-diff-info{padding:13px 10px;display:flex;gap:12px;justify-content:space-between;color:var(--gs-muted);font-size:12px}#cw-git-study .gs-diff{font:12px/1.9 ui-monospace,Consolas,monospace;padding-bottom:12px}#cw-git-study .gs-code{display:grid;grid-template-columns:28px 22px minmax(0,1fr);padding:1px 8px;color:var(--gs-ink)}#cw-git-study .gs-code code{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:transparent;border:0;padding:0;border-radius:0}#cw-git-study .gs-code .gs-num{color:var(--gs-muted);font-variant-numeric:tabular-nums;user-select:none}#cw-git-study .gs-code.add{background:var(--gs-add)}#cw-git-study .gs-code.del{background:var(--gs-delete);color:var(--gs-delete-ink)}#cw-git-study .gs-diff.paired{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}#cw-git-study .gs-diff h4{font-size:12px;font-weight:400;padding:3px 10px;margin:0;color:var(--gs-muted)}#cw-git-study .gs-prose{padding:16px;overflow-wrap:anywhere}#cw-git-study .gs-prose h3{font-size:18px;font-weight:500;margin:4px 0 16px}#cw-git-study .gs-prose p{margin:12px 0}#cw-git-study .gs-prose dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;font-size:12px}#cw-git-study .gs-prose dt{color:var(--gs-muted)}#cw-git-study .gs-prose dd{margin:0}
#cw-git-study .gs-foot{display:flex;justify-content:space-between;gap:8px;padding:10px 8px 2px;font-size:11px;color:var(--gs-casing-ink)}#cw-git-study .gs-review{position:absolute;z-index:4;left:6%;right:6%;top:100px;background:var(--gs-case);padding:12px;border:4px ridge var(--gs-edge);border-radius:12px;box-shadow:0 20px 0 900px #0008}#cw-git-study .gs-review .gs-head{justify-content:space-between}#cw-git-study [data-review-body]{padding:16px;background:var(--gs-screen);overflow-wrap:anywhere}#cw-git-study .gs-review-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding-top:16px}#cw-git-study .gs-review li{margin:6px 0;font-size:12px}#cw-git-study .gs-files{background:var(--gs-case)}#cw-git-study .gs-files img{width:100%;display:block}#cw-git-study .gs-case:has(.gs-files:not([hidden]))>:not(.gs-files){display:none}

#cw-git-study [data-theme=classic]{--gs-case:#25282d;--gs-key:#353a41;--gs-edge:#414650;--gs-shine:#626974;--gs-shadow:#17191d;--gs-screen:#1c1f24;--gs-ink:#eceef2;--gs-muted:#aeb7c3;--gs-casing-ink:#eceef2;--gs-line:#47535e;--gs-active:#354252;--gs-accent:#bbd5f4;--gs-accent-ink:#203550;--gs-add:#233e32;--gs-delete:#492e31;--gs-delete-ink:#efb6ba;font-family:system-ui,sans-serif;border-width:2px;border-radius:10px}

</style>
<script>
(() => {
  const root=document.getElementById('cw-git-study'), q=s=>root.querySelector(s);
  const settings={theme:'green',width:230};
  let view='changes', selected=0, paired=false, operation=null, ahead=1;
  const changes=[
    {name:'workspace-panels.css',path:'apps/web/src',status:'M',checked:true,rows:[[' ',' .workspace-panel {'],['-','   transition: none;'],['+','   transition: width 240ms ease;'],[' ','   min-width: 0;'],[' ',' }'],['+',''],['+',' @media (prefers-reduced-motion: reduce) {'],['+','   .workspace-panel {'],['+','     transition: none;'],['+','   }'],['+',' }']]},
    {name:'windowMotion.ts',path:'apps/web/src',status:'M',checked:true,rows:[[' ',' const duration = 170;'],['-',' window.remove();'],['+',' await animateWindowExit(window);'],['+',' closeWindow();']]},
    {name:'UI_LAYOUT_RULES.md',path:'docs',status:'A',checked:false,rows:[['+','# Панели рабочего пространства'],['+',''],['+','Корпус расширяется вместе с панелью.'],['+','Положение разделителя сохраняется.'],['+','При уменьшении движения переход мгновенный.']]}
  ];
  const history=[{name:'Объединить корпус панелей',hash:'a84b217',time:'Сегодня, 11:42',body:'Панели раскрываются внутри общей рамки. Сохранены размеры и состояние чата.'},{name:'Компактные команды файлов',hash:'bc921d3',time:'Вчера, 19:15',body:'Кнопки создания и загрузки собраны в компактную панель. Просмотру оставлено больше места.'},{name:'Добавить док рабочих окон',hash:'4d81e92',time:'Вчера, 14:30',body:'Свёрнутые окна сохраняют черновики, положение и выбранный файл.'}];
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});};
  function notice(t){q('[data-notice]').textContent=t;}
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{theme:settings.theme,section:view,sharedFiles:true},privateContent:{width:settings.width,selected,paired,message:q('textarea').value,checked:changes.map(x=>x.checked)}}).catch(()=>{});}
  function drawSettings(){q('.gs-case').dataset.theme=settings.theme;q('.gs-case').style.setProperty('--gs-list',settings.width+'px');q('.gs-split').setAttribute('aria-valuenow',settings.width);if(!q('.gs-files').hidden)showFilesImage();}
  function selection(){const n=changes.filter(x=>x.checked).length;q('[data-selection]').textContent=`Выбрано ${n} из ${changes.length}`;q('.gs-commit button').disabled=!n||!q('textarea').value.trim();q('[data-count]').textContent=changes.length;}
  function rowsMarkup(rows){return rows.map(([kind,text],i)=>`<div class="gs-code ${kind==='+'?'add':kind==='-'?'del':''}"><span class="gs-num">${i+1}</span><span>${kind}</span><code>${escape(text)}</code></div>`).join('');}
  function renderDetail(){
    q('[data-action="diff-mode"]').hidden=view!=='changes';
    const x=view==='changes'?changes[selected]:history[selected];
    if(view==='changes'){
      q('[data-detail-title]').textContent=x?.name||'Рабочая копия чиста';q('[data-detail-path]').textContent=x?.path||'Все выбранные изменения сохранены';
      q('[data-detail-content]').innerHTML=x?`<div class="gs-diff-info"><span>HEAD → рабочая копия</span><span>+${x.rows.filter(r=>r[0]==='+').length} −${x.rows.filter(r=>r[0]==='-').length}</span></div><div class="gs-diff ${paired?'paired':''}">${paired?`<div><h4>До</h4>${rowsMarkup(x.rows.filter(r=>r[0]!=='+'))}</div><div><h4>После</h4>${rowsMarkup(x.rows.filter(r=>r[0]!=='-'))}</div>`:rowsMarkup(x.rows)}</div>`:'<div class="gs-prose">Нет несохранённых изменений.</div>';
    }else if(view==='history'){
      q('[data-detail-title]').textContent=x.name;q('[data-detail-path]').textContent=x.hash+' · '+x.time;
      q('[data-detail-content]').innerHTML=`<div class="gs-prose"><h3>${escape(x.name)}</h3><p>${escape(x.body)}</p><small>Автор · Lazar · main</small><p>Изменённые файлы</p><button data-history-diff class="gs-history-file">workspace-panels.css · +8 −1</button></div>`;
      q('[data-history-diff]').onclick=()=>{q('[data-detail-content]').insertAdjacentHTML('beforeend',`<div class="gs-diff">${rowsMarkup(changes[0]?.rows||[['+','Панели раскрываются внутри корпуса.']])}</div>`);q('[data-history-diff]').disabled=true;};
    }else if(view==='branches'){
      const branch=selected===0?'main':'feature/file-tools';q('[data-detail-title]').textContent=branch;q('[data-detail-path]').textContent=selected===0?'Текущая ветка':'Локальная ветка';q('[data-detail-content]').innerHTML=`<div class="gs-prose"><h3>${branch}</h3><dl><dt>Удалённая ветка</dt><dd>origin/${branch}</dd><dt>Последний коммит</dt><dd>${selected===0?'a84b217 · Объединить корпус панелей':'f75c214 · Команды файлов'}</dd></dl></div>`;
    }else{
      q('[data-detail-title]').textContent='v0.8.0';q('[data-detail-path]').textContent='Опубликован · пример';q('[data-detail-content]').innerHTML='<div class="gs-prose"><h3>Окна и файловые инструменты</h3><p>Общий корпус, компактные команды и док рабочих окон.</p><p>Тег <code>v0.8.0</code> · ветка <code>main</code></p></div>';
    }
    icons();
  }
  function render(){
    q('.gs-main').dataset.view=view;q('.gs-commit').hidden=view!=='changes';
    root.querySelectorAll('.gs-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===view)));
    const items=view==='changes'?changes:view==='history'?history:view==='branches'?[{name:'main',path:'Текущая · origin/main'},{name:'feature/file-tools',path:'Локальная'}]:[{name:'v0.8.0',path:'Окна и файлы'}];
    q('[data-list-heading]').textContent=({changes:'Рабочая копия',history:'Коммиты',branches:'Ветки',releases:'Релизы'})[view];q('[data-list-count]').textContent=items.length;
    q('[data-items]').innerHTML=items.map((x,i)=>`<div class="gs-row" data-selected="${i===selected}">${view==='changes'?`<label><input type="checkbox" data-check="${i}" aria-label="Включить ${escape(x.name)} в коммит" ${x.checked?'checked':''}></label>`:''}<button data-item="${i}" aria-pressed="${i===selected}" data-tooltip="${escape(x.name)}"><div class="gs-name"><span>${escape(x.name)}</span><small>${escape(x.path||x.hash+' · '+x.time)}</small></div>${x.status?`<span class="gs-status" aria-label="${x.status==='A'?'Новый файл':'Изменён'}">${x.status}</span>`:''}</button></div>`).join('');
    q('[data-items]').querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.item);q('.gs-main').dataset.phoneDetail='true';render();save();});
    q('[data-items]').querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{changes[Number(c.dataset.check)].checked=c.checked;selection();save();});
    selection();renderDetail();
  }
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{view=b.dataset.tab;selected=0;q('.gs-main').dataset.phoneDetail='false';render();save();});
  q('textarea').oninput=()=>{selection();save();};
  q('.gs-commit button').onclick=()=>{if(q('.gs-commit button').disabled)return;review('commit');};
  function review(type){operation=type;q('.gs-review').hidden=false;q('.gs-main').inert=true;q('.gs-tabs').inert=true;q('.gs-source').inert=true;q('.gs-case>.gs-head').inert=true;
    q('[data-review-title]').textContent=type==='commit'?'Проверить коммит':type==='push'?'Отправить коммиты':'О репозитории';
    q('[data-action="review-confirm"]').hidden=type==='info';q('[data-action="review-confirm"]').textContent=type==='commit'?'Создать коммит':'Отправить';q('[data-action="review-confirm"]').disabled=type==='push'&&!ahead;
    q('[data-review-body]').innerHTML=type==='commit'?`<strong>${escape(q('textarea').value)}</strong><p>CodexWeb · main · рабочая копия</p><ul>${changes.filter(x=>x.checked).map(x=>`<li>${escape(x.path+'/'+x.name)}</li>`).join('')}</ul><small>После коммита изменения останутся на компьютере до отправки.</small>`:type==='push'?`<p><strong>main → origin/main</strong></p><p>${ahead} к отправке</p><small>Пример репозитория · EriArk/codex-web-interface</small>`:'<strong>CodexWeb</strong><p>Мой компьютер · D:/Projects/CodexWeb</p><small>origin · EriArk/codex-web-interface</small><p>README и сведения о репозитории находятся здесь.</p>';
    q('[data-action="review-close"]').focus({preventScroll:true});save();
  }
  function closeReview(){q('.gs-review').hidden=true;for(const s of ['.gs-main','.gs-tabs','.gs-source','.gs-case>.gs-head'])q(s).inert=false;q(operation==='commit'?'.gs-commit button':operation==='push'?'[data-action="push"]':'[data-action="info"]').focus({preventScroll:true});operation=null;}
  function showFilesImage(){const images=root.fileReferences;q('[data-files-image]').src=images?.[settings.theme]||'';}
  root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
    switch(b.dataset.action){
      case 'files':q('.gs-files').hidden=false;showFilesImage();q('[data-action="files-close"]').focus({preventScroll:true});break;
      case 'files-close':q('.gs-files').hidden=true;q('[data-action="files"]').focus({preventScroll:true});break;
      case 'info':review('info');break;
      case 'push':review('push');break;
      case 'review-close':closeReview();break;
      case 'review-confirm':if(operation==='commit'){history.unshift({name:q('textarea').value,hash:'demo001',time:'Только что · макет',body:'Выбранные изменения сохранены локально в примере.'});for(let i=changes.length-1;i>=0;i--)if(changes[i].checked)changes.splice(i,1);selected=0;ahead++;q('textarea').value='';notice('Макет · коммит создан локально');}else{ahead=0;notice('Макет · отправка завершена');}closeReview();q('[data-ahead]').textContent=ahead;render();break;
      case 'diff-mode':paired=!paired;b.setAttribute('aria-label',paired?'Показать одним списком':'Показать до и после рядом');renderDetail();break;
      case 'back':q('.gs-main').dataset.phoneDetail='false';break;
    }save();
  });
  q('.gs-review').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeReview();}if(e.key==='Tab'){const a=[...q('.gs-review').querySelectorAll('button:not([hidden]):not(:disabled)')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus();}}};
  const split=q('.gs-split');let drag=null;
  function width(n){settings.width=Math.round(Math.max(190,Math.min(360,q('.gs-main').clientWidth-270,n)));drawSettings();}
  split.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag={x:e.clientX,w:settings.width};split.setPointerCapture(e.pointerId);};split.onpointermove=e=>{if(drag)width(drag.w+e.clientX-drag.x);};split.onpointerup=split.onpointercancel=e=>{drag=null;if(split.hasPointerCapture(e.pointerId))split.releasePointerCapture(e.pointerId);save();};
  split.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.preventDefault();width(e.key==='Home'?230:settings.width+(e.key==='ArrowLeft'?-10:10));save();}};
  function restore(snapshot){const m=snapshot?.modelContent,p=snapshot?.privateContent;if(m&&['green','millennium','organizer','classic'].includes(m.theme))settings.theme=m.theme;if(m&&['changes','history','branches','releases'].includes(m.section))view=m.section;if(p){settings.width=Number.isFinite(p.width)?Math.max(190,Math.min(360,p.width)):230;selected=Number.isInteger(p.selected)?Math.max(0,Math.min(2,p.selected)):0;paired=!!p.paired;if(typeof p.message==='string')q('textarea').value=p.message;changes.forEach((x,i)=>{if(typeof p.checked?.[i]==='boolean')x.checked=p.checked[i];});}if(view==='branches')selected=Math.min(selected,1);if(view==='releases')selected=0;drawSettings();render();}
  restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
  root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
  if(globalThis.Tweak){const tweak=new Tweak({container:q('.gs-case'),onChange:()=>{drawSettings();save();}});tweak.addSelect(settings,'theme',{label:'Тема',options:[{label:'Зелёная',value:'green'},{label:'2000',value:'millennium'},{label:'Органайзер',value:'organizer'},{label:'Тёмная',value:'classic'}]});tweak.addSlider(settings,'width',{label:'Ширина списка',min:190,max:300,unit:'px'});}
})();
</script>
