<!doctype html>
<html lang="en" data-theme="crt-green" data-theme-variant="green" data-case-color="red">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AbyssDeck — Interactive demo</title>
  <style>/* Materials from the owner's references; every theme uses the same workspace. */
:root,
:root[data-theme="organizer"] {
  --paper: #fbfbf7;
  --canvas: #eeece4;
  --nav: #f4f2eb;
  --surface: #fffef9;
  --ink: #2c3830;
  --muted: #687568;
  --line: #d9d9cc;
  --accent: #3e6b58;
  --accent-ink: #fffef8;
  --soft: #dae6d9;
  --gold: #a58c61;
  --danger: #a14336;
  --shadow: 0 8px 24px #3346310e;
  color-scheme: light;
}
:root[data-theme="organizer"] .workspace {
  padding: 9px 21px 9px 29px;
  border-radius: 10px;
  background: linear-gradient(
    90deg,
    #b5b1a3,
    #efede2 18px,
    #fcfbf5 33px,
    #f9f8ef calc(100% - 22px),
    #d0cbbb
  );
  box-shadow:
    inset 0 0 0 1px #a8a594,
    inset 0 -4px 0 #ddd9ca;
}
:root[data-theme="organizer"] .workspace::before {
  content: "";
  pointer-events: none;
  position: absolute;
  z-index: 3;
  top: 98px;
  bottom: 40px;
  left: 3px;
  width: 31px;
  background:
    radial-gradient(ellipse 3px 5px at 25px 15px, #464a3b 80%, transparent) 0 0 / 31px 105px,
    radial-gradient(
      ellipse 14px 5px at 14px 15px,
      transparent 48%,
      #c1c3b8 52% 61%,
      #42493c 68% 82%,
      transparent 89%
    )
    0 0 / 31px 105px;
  filter: drop-shadow(0 1px 1px #202b2440);
}
:root[data-theme="organizer"] .workspace::after {
  content: "";
  pointer-events: none;
  position: absolute;
  right: 1px;
  top: 108px;
  width: 19px;
  height: 330px;
  border-radius: 0 5px 5px 0;
  background: linear-gradient(
    #ded2ad 0 72px,
    transparent 72px 81px,
    #b9cbd9 81px 153px,
    transparent 153px 162px,
    #c8d3b3 162px 234px,
    transparent 234px 243px,
    #d9bdb8 243px 315px,
    transparent 315px
  );
  filter: drop-shadow(1px 2px 1px #62574066);
}
:root[data-theme="organizer"] .desktop-nav {
  background: linear-gradient(90deg, #e7e4d7, #f6f4eb 7px, #f1eee5);
  border-radius: 7px 4px 6px 8px;
  border-right: 1px solid #b9bba9;
  box-shadow:
    3px 0 4px #60655024,
    inset 0 1px #fff;
  z-index: 1;
}
:root[data-theme="organizer"] .desktop-nav::before {
  display: none;
}
:root[data-theme="organizer"] .workspace-header {
  border-radius: 6px 6px 0 0;
  background: linear-gradient(#fffef8, #f7f5ed);
}
:root[data-theme="organizer"] .chat-pane {
  background: radial-gradient(ellipse at 40% 35%, #fffefa90, transparent 70%), var(--paper);
}
:root[data-theme="organizer"] .nav-project.selected {
  background: linear-gradient(#dbe8de, #d5e1d6);
  box-shadow:
    inset 3px 0 var(--accent),
    0 1px 3px #44534212;
}
:root[data-theme="organizer"] .nav-brand {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 500;
  font-size: 26px;
}
:root[data-theme="organizer"] .brand-subtitle {
  font-family: "Roboto Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
:root[data-theme="organizer"] .result-card {
  border-radius: 5px;
  border-color: #d8dace;
  box-shadow: 0 2px 4px #3343310c;
}
:root[data-theme="organizer"] .result-title {
  background: linear-gradient(90deg, #eff3e8, #f9faf2);
}
:root[data-theme="organizer"] .composer {
  border-radius: 9px;
  background: linear-gradient(#fffefb, #f7f7ed);
  box-shadow: 0 2px 5px #58604713;
}
:root[data-theme="organizer"] .support-tabs button {
  border-radius: 5px 5px 0 0;
}

:root[data-theme="organizer"] .message.user .message-body {
  background: #eef1e9;
  border: 1px solid #e1e5d8;
  border-radius: 6px;
}
:root[data-theme="organizer"] .message.user .avatar {
  border-radius: 50%;
  color: #f8fcff;
  background: #6689b1;
  box-shadow: inset 0 1px #ffffff60;
}
:root[data-theme="organizer"] .result-title {
  background: linear-gradient(#fcfcf7, #f3f4ed);
  border-bottom: 1px solid #e6e7dc;
}
:root[data-theme="organizer"] .result-title:has(.badge.success) {
  background: linear-gradient(#f2f7ee, #e5efe0);
}
:root[data-theme="organizer"] .support-pane {
  background: #f4f3eb;
}

:root[data-theme="crt-green"] {
  --paper: #040f08;
  --canvas: #061009;
  --nav: #06130b;
  --surface: #0a1b10;
  --ink: #a0f4b0;
  --muted: #76b78a;
  --line: #2c6140;
  --accent: #9affae;
  --accent-ink: #072410;
  --soft: #173e24;
  --gold: #8dcc9e;
  --danger: #ffba97;
  --shadow: 0 0 12px #55f98718;
  --crt-glow: 0 0 2px #94ffa82b, 0 0 8px #57ff8540;
  --crt-strong-glow: 0 0 3px #9affad60, 0 0 12px #53ff8560;
  --crt-raster: repeating-linear-gradient(0deg, #00000026 0 1px, transparent 1px 3px);
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  text-shadow: var(--crt-glow);
  color-scheme: dark;
}
:root[data-theme="crt-green"] .workspace {
  border: 14px solid #17201a;
  border-top-color: #0c140f;
  border-bottom-color: #29342d;
  border-radius: 27px;
  background: var(--paper);
  box-shadow:
    inset 0 0 0 1px #6feb9490,
    inset 0 0 32px #20ba4826,
    0 0 0 1px #020604;
}
:root[data-theme="crt-green"] .workspace::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 12px;
  box-shadow:
    inset 0 0 15px #0008,
    inset 0 0 2px 1px #8dfdaa80;
  z-index: 3;
}
:root[data-theme="crt-green"] .workspace::after {
  display: none;
}
/* Raster and glass are behind content: photographs and Remote retain their colors. */
:root[data-theme="crt-green"]
:is(
  .chat-pane,
  .support-pane,
  .desktop-nav,
  .project-sheet,
  .settings-dialog,
  .project-dialog,
  .login-card
) {
  background-image:
    var(--crt-raster), radial-gradient(ellipse at 35% 0, #58ff7610, transparent 70%);
}
:root[data-theme="crt-green"] .desktop-nav {
  background-color: var(--nav);
  border-color: var(--line);
}
:root[data-theme="crt-green"] .desktop-nav::before {
  display: none;
}
:root[data-theme="crt-green"] :is(.workspace-header, .pane-heading, .support-tabs, .mobile-tabs) {
  background: var(--crt-raster), linear-gradient(#0b1e11, #06140c);
  border-color: #3b7d4f;
  box-shadow: 0 1px 7px #51f87712;
}
:root[data-theme="crt-green"]
  :is(
    .nav-brand,
    .header-project,
    .pane-heading,
    .result-title,
    .turn-status,
    .mobile-tabs > .active
  ) {
  text-shadow: var(--crt-strong-glow);
}
:root[data-theme="crt-green"] .nav-brand {
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -1px;
}
:root[data-theme="crt-green"] .nav-brand img {
  filter: grayscale(1) sepia(1) hue-rotate(75deg) saturate(2);
}
:root[data-theme="crt-green"] .folder-icon {
  color: var(--accent);
}
:root[data-theme="crt-green"]
  :is(
    .nav-project,
    .nav-thread,
    .primary,
    .secondary,
    .composer,
    .result-card,
    .nav-search,
    .avatar
  ) {
  border-radius: 3px;
}
:root[data-theme="crt-green"] .nav-project.selected {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 0 9px #72ff8b35;
}
:root[data-theme="crt-green"] .nav-project.selected :is(small, .folder-icon) {
  color: #174527;
}
:root[data-theme="crt-green"]
  :is(.primary, .nav-project.selected, .nav-project.selected *, .send-button) {
  text-shadow: none;
}
:root[data-theme="crt-green"] .message.user .message-body {
  background: var(--crt-raster), #0a2011;
  border: 1px solid #34734a;
  border-radius: 3px;
}
:root[data-theme="crt-green"] .avatar {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  box-shadow:
    0 0 7px #59ee7826,
    inset 0 0 5px #59ee7815;
}
:root[data-theme="crt-green"] :is(.composer, .result-card) {
  border-color: #3e8c55;
  box-shadow:
    inset 0 0 0 1px #0008,
    0 0 8px #49fb7520;
}
:root[data-theme="crt-green"] .composer {
  background: var(--crt-raster), #07180d;
}
:root[data-theme="crt-green"] :is(.support-tabs button.active, .mobile-tabs button.active) {
  background: #163d22;
  box-shadow:
    inset 0 0 0 1px #80e89970,
    0 0 9px #46ed6926;
}
:root[data-theme="crt-green"] .result-title {
  background: var(--crt-raster), #102a18;
}
:root[data-theme="crt-green"] :is(pre, code) {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  text-shadow: none;
}
:root[data-theme="crt-green"] :is(input, textarea, select, .remote-pane, .image-viewer) {
  text-shadow: none;
}
:root[data-theme="crt-green"] ::selection {
  background: #9affae;
  color: #072410;
  text-shadow: none;
}
.crt-green .theme-swatch {
  background: repeating-linear-gradient(0deg, #051309 0 1px, #17391d 1px 3px);
  box-shadow:
    inset -8px 0 #94ffaa,
    0 0 7px #6aff9840;
}

:root[data-theme="classic-dark"] {
  --paper: #15181d;
  --canvas: #101216;
  --nav: #111419;
  --surface: #1e2229;
  --ink: #e3e6ec;
  --muted: #a1a8b4;
  --line: #343b46;
  --accent: #b3c7e3;
  --accent-ink: #152234;
  --soft: #293343;
  --gold: #a9b8cc;
  --danger: #ffaba4;
  --shadow: 0 8px 24px #00000024;
  color-scheme: dark;
}
:root[data-theme="classic-dark"] .workspace {
  background: var(--canvas);
}
:root[data-theme="classic-dark"] .workspace::before,
:root[data-theme="classic-dark"] .workspace::after,
:root[data-theme="classic-dark"] .desktop-nav::before {
  display: none;
}
:root[data-theme="classic-dark"] :is(.workspace-header, .support-tabs, .mobile-tabs) {
  background: var(--nav);
}
:root[data-theme="classic-dark"] .nav-brand img {
  filter: grayscale(1);
}
:root[data-theme="classic-dark"] :is(.folder-icon, .project-bookmark) {
  color: var(--muted);
}
:root[data-theme="classic-dark"] :is(.nav-project.selected, .mobile-tabs > :is(button, a).active) {
  background: var(--soft);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px #46556c;
}
:root[data-theme="classic-dark"] .message.user .message-body {
  background: #242c38;
  border: 1px solid #354152;
}
:root[data-theme="classic-dark"] .message.user .avatar {
  background: #343e4e;
  color: #e3e6ec;
}
:root[data-theme="classic-dark"] .composer {
  background: var(--surface);
  border-color: #485365;
  box-shadow: 0 4px 16px #0003;
}
:root[data-theme="classic-dark"] .result-title {
  background: #252c36;
}
:root[data-theme="classic-dark"] :is(.project-sheet, .settings-dialog, .project-dialog) {
  box-shadow: 0 18px 60px #0009;
}
:root[data-theme="classic-dark"] ::selection {
  background: #405879;
  color: #ffffff;
}
.classic-dark .theme-swatch {
  background: #191d24;
  box-shadow: inset -8px 0 #a5bad7;
}

@media (max-width: 1099px) {
  :root[data-theme="organizer"] .workspace {
    padding: 3px 5px 0;
    border-radius: 0;
  }
  :root[data-theme="organizer"] .workspace::before {
    display: none;
  }
  :root[data-theme="organizer"] .workspace::after {
    width: 3px;
    right: 0;
    top: 120px;
    filter: none;
  }
  :root[data-theme="organizer"] .mobile-tabs {
    background: linear-gradient(#f5f3e9, #eae7dc);
  }
  :root[data-theme="organizer"] .mobile-tabs > :is(button, a).active {
    box-shadow: inset 0 2px #93ae91;
    border-radius: 6px;
  }
  :root[data-theme="crt-green"] .workspace {
    border-width: 5px;
    border-radius: 13px;
  }
  :root[data-theme="crt-green"] .workspace::before {
    border-radius: 7px;
    box-shadow: inset 0 0 0 1px #54986c80;
  }
  :root[data-theme="crt-green"] .workspace::after {
    display: none;
  }
  :root[data-theme="hitech-2000s"] .workspace {
    padding: 4px;
    border-radius: 9px;
  }
  :root[data-theme="hitech-2000s"] .workspace-header {
    border-radius: 8px;
    margin-bottom: 4px;
  }
  :root[data-theme="hitech-2000s"] .chat-pane,
  :root[data-theme="hitech-2000s"] .support-pane {
    border-radius: 9px;
  }
  :root[data-theme="hitech-2000s"] .mobile-tabs {
    margin-top: 4px;
    border: 1px solid #8aa8b7;
    border-radius: 8px;
    background: linear-gradient(#f5f9fc, #c9d6df 48%, #bdcbd5 52%, #e2eaf0);
    min-height: calc(56px + env(safe-area-inset-bottom));
  }
  :root[data-theme="hitech-2000s"] .workspace::before,
  :root[data-theme="hitech-2000s"] .workspace::after {
    display: none;
  }
}
/* This rule comes last: no theme frame is allowed to reduce the Remote viewport. */
:root .workspace[data-remote-immersive="true"] {
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: #101413;
}
:root .workspace[data-remote-immersive="true"] .support-pane {
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
:root .workspace[data-remote-immersive="true"]::before,
:root .workspace[data-remote-immersive="true"]::after {
  display: none;
}

@media (prefers-contrast: more), (forced-colors: active) {
  :root[data-theme="crt-green"] {
    --crt-glow: none;
    --crt-strong-glow: none;
    --crt-raster: none;
  }
}

/* Shared surfaces: materials change, controls and content stay the same. */
:root {
  --panel-material: var(--surface);
  --panel-heading: var(--surface);
  --card-material: var(--surface);
  --card-shadow: 0 2px 8px #00000008;
  --field-shadow: none;
  --selected-shadow: inset 3px 0 var(--accent);
  --tab-material: var(--soft);
}
:root[data-theme="organizer"] {
  --radius-sm: 4px;
  --radius: 7px;
  --radius-lg: 11px;
  --paper: #fffdf5;
  --canvas: #eae6d9;
  --surface: #faf7ed;
  --line: #d4d2bf;
  --panel-material: linear-gradient(100deg, #eee9db, #fffdf5 12%, #faf7eb);
  --panel-heading: linear-gradient(#fffdf5, #eee9d9);
  --card-material: linear-gradient(110deg, #fffefa, #faf8ee);
  --card-shadow: 0 1px 1px #796b3220, 0 3px 7px #61502c0b;
  --field-shadow: inset 0 1px 2px #7a6b3610, 0 1px #fff9;
  --tab-material: linear-gradient(#e4eddc, #d5e2ca);
}
:root[data-theme="crt-green"] {
  --radius-sm: 2px;
  --radius: 3px;
  --radius-lg: 6px;
  --ink: #aaf5b8;
  --muted: #82bb93;
  --crt-glow: 0 0 7px #5bf98226;
  --crt-strong-glow: 0 0 3px #9affad40, 0 0 10px #53ff854d;
  --crt-raster: repeating-linear-gradient(0deg, #00000020 0 1px, transparent 1px 3px);
  --panel-material:
    var(--crt-raster), radial-gradient(ellipse at 35% 0, #173c201f, transparent 80%), #06140b;
  --panel-heading: var(--crt-raster), linear-gradient(#0b2111, #06130b);
  --card-material: var(--crt-raster), linear-gradient(110deg, #0a1d10, #07150c);
  --card-shadow: inset 0 1px #7ffa9620, 0 0 9px #5cef7810;
  --field-shadow: inset 0 1px 4px #0008;
  --tab-material: var(--crt-raster), #173e24;
  --selected-shadow: inset 2px 0 #9affae, inset 0 0 18px #72ff9510;
}
/* Screen character without a monitor housing or lost working space. */
:root[data-theme="crt-green"] .workspace:not([data-remote-immersive="true"]) {
  border: 0;
  box-shadow: none;
}
:root[data-theme="crt-green"] .workspace::before {
  display: none;
}
:root[data-theme="crt-green"] :is(.gpt-chat, .gpt-results) {
  background-image:
    var(--crt-raster), radial-gradient(ellipse at 35% 0, #58ff7610, transparent 70%);
  background-color: var(--paper);
}
:root[data-theme="crt-green"] :is(.nav-search, .inspector-search) {
  box-shadow:
    inset 0 1px 5px #0007,
    0 1px #80ff9914;
}
:root[data-theme="classic-dark"] {
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --card-shadow: 0 2px 8px #00000014;
}

:root
  :is(
    .notebook-dialog,
    .project-overview-modal,
    .project-setup-dialog,
    .gpt-settings,
    .project-gpt-window
  ) {
  background: var(--panel-material);
  border-radius: var(--radius-lg);
}
:root
  :is(
    .notebook-heading,
    .inspector-heading,
    .project-overview-heading,
    .core-footer,
    .project-gpt-heading
  ) {
  background: var(--panel-heading);
}
:root :is(.notebook-heading, .inspector-heading) strong {
  letter-spacing: 0.01em;
}
:root
  :is(
    .overview-card,
    .plan-section,
    .project-action,
    .reference-picker,
    .repository-summary,
    .repository-card,
    .note-source-card,
    .task-fields,
    .core-version[aria-pressed="true"]
  ) {
  background: var(--card-material);
  box-shadow: var(--card-shadow);
}
:root
  :is(
    .notebook-row[data-selected="true"],
    .core-version[aria-pressed="true"],
    .inspector-list > li.selected
  ) {
  box-shadow: var(--selected-shadow);
  border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
}
:root :is(.notebook-modules, .inspector-tabs) {
  background: var(--panel-heading);
  padding-inline: 10px;
  gap: 5px;
}
:root :is(.notebook-modules, .inspector-tabs) button {
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  border-bottom-width: 2px;
}
:root
  :is(
    .notebook-modules button[aria-pressed="true"],
    .inspector-tabs button.active,
    .task-project-filters button[aria-pressed="true"]
  ) {
  background: var(--tab-material);
  color: var(--ink);
}
:root
  :is(
    .notebook-list > input,
    .core-field textarea,
    .inspector-path input,
    .inspector-search,
    .task-fields input,
    .task-fields select
  ) {
  box-shadow: var(--field-shadow);
  border-radius: var(--radius);
}
:root :is(.notebook-editor, .core-content, .project-overview) {
  background: var(--paper);
}
:root .notebook-list {
  background: color-mix(in srgb, var(--surface) 80%, var(--canvas));
}
:root :is(.plan-section > header, .repository-card > header, .repository-card > summary) {
  border-radius: var(--radius) var(--radius) 0 0;
  background: color-mix(in srgb, var(--surface) 75%, transparent);
}
:root .notebook-editor :is(.plan-description, .notebook-body):focus {
  outline: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  outline-offset: 2px;
}

/* Paper details occupy the existing gutter and tab strip, never a new column. */
:root[data-theme="organizer"] :is(.notebook-modules, .inspector-tabs) {
  padding-top: 4px;
  box-shadow: inset 0 -1px #bcbda9;
}
:root[data-theme="organizer"] .notebook-modules button {
  --tab-tint: #d9e4cf;
  background: linear-gradient(color-mix(in srgb, var(--tab-tint) 60%, #fff), var(--tab-tint));
  border: 1px solid #b4baa780;
  border-bottom: 2px solid transparent;
  box-shadow: inset 0 1px #fff9;
}
:root[data-theme="organizer"] .notebook-modules button:nth-child(2) {
  --tab-tint: #eee2bb;
}
:root[data-theme="organizer"] .notebook-modules button:nth-child(3) {
  --tab-tint: #ccdeea;
}
:root[data-theme="organizer"] .notebook-modules button:nth-child(4) {
  --tab-tint: #e5cfc8;
}
:root[data-theme="organizer"] .notebook-modules button[aria-pressed="true"] {
  border-bottom-color: var(--accent);
  color: #28392d;
}
:root[data-theme="organizer"] .notebook-editor {
  background-image: linear-gradient(90deg, transparent 11px, #be908228 11px 12px, transparent 12px);
  box-shadow: inset 3px 0 5px #6e5b3010;
}
:root[data-theme="organizer"] .notebook-body {
  line-height: 1.7;
  background: repeating-linear-gradient(
      transparent 0 calc(1.7em - 1px),
      #677e4812 calc(1.7em - 1px) 1.7em
    )
    0 4px;
}
:root[data-theme="organizer"] :is(.notebook-heading, .project-overview-heading) {
  box-shadow:
    inset 0 -1px #fff9,
    0 1px 3px #64542b12;
}
:root[data-theme="organizer"] .overview-card {
  border-top: 3px solid #b5c8a9;
}
:root[data-theme="organizer"] .overview-card:nth-child(3n + 2) {
  border-top-color: #bccfdc;
}
:root[data-theme="organizer"] .overview-card:nth-child(3n + 3) {
  border-top-color: #dfcdb0;
}
:root[data-theme="organizer"] :is(.gpt-chat, .gpt-composer) {
  background: linear-gradient(110deg, #fffdf6, #f8f6eb);
}

:root[data-theme="crt-green"] :is(.notebook-editor, .core-content, .project-overview) {
  background: var(--panel-material);
}
:root[data-theme="crt-green"]
  :is(.notebook-heading, .notebook-modules button[aria-pressed="true"], .repository-identity h2) {
  text-shadow: var(--crt-strong-glow);
}
:root[data-theme="crt-green"] .gpt-composer {
  background: var(--card-material);
  border-color: #3e8c55;
  box-shadow: var(--card-shadow);
  border-radius: var(--radius);
}

/* Keep phone safe-area geometry; decorations never sit over media. */
@media (min-width: 1100px) {
  :root[data-theme="crt-green"] .workspace {
    border-radius: 0;
  }
}
@media (prefers-contrast: more), (forced-colors: active) {
  :root[data-theme="crt-green"] {
    --crt-glow: none;
    --crt-strong-glow: none;
    --crt-raster: none;
  }
}

/* TrainerOS material reference: tinted polymer, contact edges and inset screens. */
:root,
[data-case-color="turquoise"] {
  --polymer-tint: #286b70;
  --polymer-ink: #172125;
}
[data-case-color="graphite"] {
  --polymer-tint: #262b32;
  --polymer-ink: #f0f4f7;
}
[data-case-color="white"] {
  --polymer-tint: #f0eee8;
}
[data-case-color="yellow"] {
  --polymer-tint: #f5df8f;
}
[data-case-color="mint"] {
  --polymer-tint: #80baa5;
}
[data-case-color="purple"] {
  --polymer-tint: #74508f;
}
[data-case-color="pink"] {
  --polymer-tint: #c07e9c;
}
[data-case-color="green"] {
  --polymer-tint: #3d6d4f;
}
[data-case-color="blue"] {
  --polymer-tint: #3c6292;
}
[data-case-color="red"] {
  --polymer-tint: #9f3f47;
}
[data-case-color="orange"] {
  --polymer-tint: #d08b50;
}
[data-case-color="silver"] {
  --polymer-tint: #cfd5dc;
}
/* Every material owns its ink, including a swatch inside another color. */
[data-case-color] {
  --polymer-ink: #10191d;
  --polymer-letter-shadow: 0 1px 0 #ffffffa6;
}
:is(
  [data-case-color="graphite"],
  [data-case-color="red"],
  [data-case-color="green"],
  [data-case-color="turquoise"],
  [data-case-color="blue"],
  [data-case-color="purple"]
) {
  --polymer-ink: #f7f5eb;
  --polymer-letter-shadow: 0 1px 0 #06131ce6, 0 -1px 0 #ffffff1a;
}

:is(:root, .case-swatch):is([data-theme="crt-green"], [data-theme="hitech-2000s"]) {
  --case-tint: var(--polymer-tint);
  --case-top: color-mix(in srgb, var(--case-tint) 94%, #fff);
  --case-mid: var(--case-tint);
  --case-low: color-mix(in srgb, var(--case-tint) 90%, #131a22);
  --case-edge: color-mix(in srgb, var(--case-tint) 55%, #fff);
  --case-seam: color-mix(in srgb, var(--case-tint) 30%, #020a0b);
  --case-ink: var(--polymer-ink);
  --case-muted: var(--case-ink);
  --case-glint: #ffffffb3;
  --case-letter-shadow: var(--polymer-letter-shadow);
  --case-surface:
    radial-gradient(#ffffff08 0.4px, transparent 0.7px) 0 0 / 3px 3px,
    linear-gradient(180deg, #ffffff12, transparent 7px calc(100% - 5px), #00000024),
    linear-gradient(140deg, var(--case-top), var(--case-mid) 38%, var(--case-low));
  --case-shadow:
    inset 0 1px 0 var(--case-glint), inset 1px 0 0 #ffffff40,
    inset -1px 0 0 #00000030, inset 0 -2px 0 var(--case-seam),
    0 2px 0 #0005, 0 4px 5px #0004;
  --screen-shadow: inset 0 2px 5px #051d292b, inset 0 0 0 1px #06192026, 0 1px 0 var(--case-glint);
  --screen-material: var(--paper);
  --cap-top: color-mix(in srgb, var(--case-tint) 28%, #fff6e7);
  --cap-mid: color-mix(in srgb, var(--case-tint) 44%, #f4ead8);
  --cap-low: color-mix(in srgb, var(--case-tint) 54%, #f4ead8);
  --cap-ink: #10191d;
  --cap-letter-shadow: 0 1px 0 #ffffffb3;
  --cap-surface: linear-gradient(180deg, var(--cap-top), var(--cap-mid) 42%, var(--cap-low));
  --cap-shadow:
    inset 0 1px 0 #fff9, inset 1px 0 0 #fff5, inset 0 -1px 0 #0004, 0 2px 0 var(--case-seam),
    0 3px 3px #0005;
  --case-pressed: linear-gradient(180deg, var(--cap-low), var(--cap-mid));
  --case-pressed-shadow: inset 0 2px 3px #0007, inset 0 0 0 1px #0003, 0 1px var(--case-glint);
  --panel-heading: var(--case-surface);
  --panel-material: var(--surface);
  --field-shadow: inset 0 2px 3px #00161626, 0 1px #fff8;
  --status-surface: var(--case-low);
}
:is(:root, .case-swatch)[data-theme="crt-green"] {
  /* Evening casing: a neutral charcoal mix, never a green filter. */
  --case-tint: color-mix(in srgb, var(--polymer-tint) 16%, #07080b);
  --case-top: color-mix(in srgb, var(--case-tint) 98%, #fff);
  --case-edge: color-mix(in srgb, var(--case-tint) 72%, #fff);
  --case-glint: #ffffff70;
  --case-ink: #f7f5eb;
  --case-letter-shadow: 0 1px 0 #000c;
  --cap-top: color-mix(in srgb, var(--case-tint) 90%, #89929a);
  --cap-mid: color-mix(in srgb, var(--case-tint) 84%, #05070c);
  --cap-low: color-mix(in srgb, var(--case-tint) 76%, #05070c);
  --cap-ink: #f7f5eb;
  --cap-letter-shadow: 0 1px 0 #000c;
  --cap-shadow:
    inset 0 1px 0 #ffffff50, inset 1px 0 0 #fff2, inset 0 -1px 0 #0009, 0 2px 0 var(--case-seam),
    0 3px 3px #0007;
  --screen-shadow: inset 0 2px 6px #000b, inset 0 0 0 1px #000a, 0 1px #b8ebc426;
  --screen-material:
    var(--crt-raster), radial-gradient(ellipse at 35% 0, #58ff7610, transparent 70%), var(--paper);
  --panel-material: var(--crt-raster), #06140b;
  --field-shadow: inset 0 2px 4px #000a, 0 1px #9ce9ae18;
}
/* Deliberately bright, polished shells, even around the evening CRT screen. */
:is(:root, .case-swatch):is([data-theme="crt-green"], [data-theme="hitech-2000s"]):is(
  [data-case-color="white"],
  [data-case-color="yellow"],
  [data-case-color="silver"]
) {
  --case-tint: var(--polymer-tint);
  --case-top: color-mix(in srgb, var(--case-tint) 70%, #fff);
  --case-edge: color-mix(in srgb, var(--case-tint) 32%, #fff);
  --case-glint: #ffffffeb;
  --case-ink: #172125;
  --case-letter-shadow: 0 1px 0 #ffffffc9;
  --case-surface:
    linear-gradient(115deg, #ffffff65, transparent 28% 64%, #ffffff1c),
    linear-gradient(180deg, #ffffffa6, transparent 10px calc(100% - 5px), #00000018),
    linear-gradient(160deg, var(--case-top), var(--case-mid) 50%, var(--case-low));
  --cap-top: color-mix(in srgb, var(--case-tint) 30%, #fff);
  --cap-mid: color-mix(in srgb, var(--case-tint) 92%, #edf1f7);
  --cap-low: color-mix(in srgb, var(--case-tint) 86%, #8f98a0);
  --cap-ink: #172125;
  --cap-letter-shadow: 0 1px 0 #ffffffc9;
  --cap-shadow:
    inset 0 1px 0 #fff, inset 1px 0 0 #fff9, inset 0 -1px 0 #0004, 0 2px 0 var(--case-seam),
    0 3px 3px #0005;
}
/* Dark CRT plastic is matte: relief comes from seams, not illuminated edges. */
:is(:root, .case-swatch)[data-theme="crt-green"]:not(
  :is([data-case-color="white"], [data-case-color="yellow"], [data-case-color="silver"])
) {
  --case-top: var(--case-tint);
  --case-edge: color-mix(in srgb, var(--case-tint) 88%, #46505a);
  --case-glint: transparent;
  --case-surface: linear-gradient(180deg, var(--case-mid), var(--case-low));
  --case-shadow:
    inset 0 0 0 1px #0005, inset 0 -2px 0 var(--case-seam), 0 2px 0 #0005, 0 4px 5px #0004;
  --cap-top: color-mix(in srgb, var(--case-tint) 92%, #46505a);
  --cap-shadow:
    inset 0 1px 0 #ffffff0c, inset 0 -1px 0 #0009, 0 2px 0 var(--case-seam), 0 3px 3px #0007;
}
:root[data-theme="hitech-2000s"] {
  --paper: #fcfcf5;
  --canvas: #edf2e9;
  --surface: #f4f7ef;
  --nav: #edf2e9;
  --ink: #193f3b;
  --muted: #526d63;
  --line: #b1c2b8;
  --accent: #1c625d;
  --accent-ink: #f8fff8;
  --soft: #d4e8df;
  --radius-sm: 5px;
  --radius: 9px;
  --radius-lg: 15px;
  --card-material: linear-gradient(145deg, #fffef9, #eaf0e5);
  --card-shadow: inset 0 1px #fff, 0 2px 0 #526e6026, 0 3px 7px #0d302d10;
  --tab-material: linear-gradient(#e7f4e0, #c8dfbb);
  --selected-shadow: inset 3px 0 #376b51, inset 0 1px #fff9;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) body {
  background: var(--case-low);
}

/* Headers and control rails are the casing; reading surfaces remain distinct. */
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
:is(
  .workspace-header,
  .mobile-tabs,
  .pane-heading,
  .support-tabs,
  .navigation-system-row,
  .notebook-heading,
  .inspector-heading,
  .project-overview-heading,
  .dialog-heading,
  .gpt-settings-heading,
  .notebook-modules,
  .inspector-tabs,
  .core-footer
) {
  background: var(--case-surface);
  color: var(--case-ink);
  border-color: var(--case-seam);
  box-shadow: var(--case-shadow);
  text-shadow: var(--case-letter-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :where(
    .workspace-header,
    .mobile-tabs,
    .pane-heading,
    .support-tabs,
    .navigation-system-row,
    .notebook-heading,
    .inspector-heading,
    .project-overview-heading,
    .dialog-heading,
    .gpt-settings-heading,
    .notebook-modules,
    .inspector-tabs,
    .core-footer
  )
  :where(button, a, h1, h2, h3, strong, .icon-button, .header-project, .folder-icon) {
  color: inherit;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(
    .workspace-header .header-subtitle,
    .navigation-system-row .nav-remote,
    .navigation-system-row .nav-settings,
    .pane-heading > span
  ) {
  color: var(--case-muted);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .workspace-header {
  border-width: 1px;
  border-style: solid;
  border-top-color: var(--case-edge);
  border-radius: 13px 13px 6px 6px;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .navigation-system-row {
  border: 1px solid var(--case-seam);
  border-top-color: var(--case-edge);
  border-radius: 12px;
  padding: 8px;
  gap: 4px;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .mobile-tabs {
  border-top: 1px solid var(--case-edge);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(
    .mobile-tabs > .active,
    .support-tabs button.active,
    .notebook-modules button[aria-pressed="true"],
    .inspector-tabs button.active
  ) {
  color: var(--cap-ink);
  background: var(--case-pressed);
  border: 1px solid color-mix(in srgb, var(--case-edge) 65%, var(--case-seam));
  box-shadow: var(--case-pressed-shadow);
  text-shadow: var(--cap-letter-shadow);
}

/* Inset mounting ring and an independent cap: the hit target never moves. */
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) button.client-picker {
  position: relative;
  isolation: isolate;
  width: 58px;
  height: 58px;
  min-width: 58px;
  min-height: 58px;
  border: 1px solid var(--case-edge);
  border-top-color: var(--case-seam);
  background: color-mix(in srgb, var(--case-low) 60%, var(--case-seam));
  color: var(--case-ink);
  box-shadow:
    inset 0 1px 2px #0006,
    0 1px 1px color-mix(in srgb, var(--case-glint) 55%, transparent);
  filter: none;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) button.client-picker::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px solid var(--case-seam);
  background: radial-gradient(ellipse at 50% 0, #ffffff1c, transparent 65%), var(--cap-surface);
  box-shadow:
    inset 0 1px 1px var(--case-glint),
    inset 0 -1px 1px #0004,
    0 1px 2px #0006;
  pointer-events: none;
  transition:
    transform 100ms,
    box-shadow 100ms;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) button.client-picker > svg {
  position: relative;
  transform: none;
  filter: none;
  transition: transform 100ms;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  button.client-picker:active::before {
  transform: translateY(1px);
  box-shadow:
    inset 0 1px 2px #0005,
    inset 0 -1px var(--case-glint),
    0 1px 0 var(--case-seam);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) button.client-picker:active > svg {
  transform: translateY(1px);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) button.client-picker:focus-visible {
  outline-color: var(--case-ink);
}

/* A continuous narrow rim connects screen wells and control rails in both clients. */
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
.workspace:not([data-remote-immersive="true"]) {
  padding: 7px;
  border: 1px solid var(--case-seam);
  border-top-color: var(--case-edge);
  background: var(--case-surface);
  box-shadow: var(--case-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .workspace::before,
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .workspace::after {
  display: none;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .workspace-header {
  margin-bottom: 5px;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) :is(.desktop-nav, .project-sheet) {
  border: 1px solid var(--case-seam);
  border-top-color: var(--case-edge);
  border-radius: 14px;
  background: var(--case-surface);
  box-shadow: var(--case-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .desktop-nav {
  margin-right: 7px;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .desktop-nav::before {
  display: none;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .sheet-content {
  background: transparent;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) :is(.nav-scroll, .gpt-nav-list) {
  background: var(--nav);
  border: 1px solid var(--case-seam);
  border-radius: 8px;
  box-shadow: var(--screen-shadow);
  padding: 4px;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .navigation-top-row > button {
  color: var(--case-ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.nav-bottom, .navigation-inner > .workspace-links) {
  color: var(--case-ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .workspace-shortcuts button {
  color: var(--case-ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .nav-mobile-switch {
  background: var(--case-low);
  color: var(--case-ink);
  border-radius: 8px;
  box-shadow: inset 0 2px 3px #0005;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .nav-mobile-switch button {
  color: inherit;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .nav-mobile-switch button.selected {
  --muted: var(--cap-ink);
  --accent: var(--cap-ink);
  background: var(--case-pressed);
  color: var(--cap-ink);
  box-shadow: var(--case-pressed-shadow);
  text-shadow: var(--cap-letter-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  .nav-mobile-switch
  .nav-tab-title
  small {
  opacity: 1;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .nav-mobile-switch button {
  --accent: var(--case-ink);
  --muted: var(--case-muted);
  --gold: #f4d795;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.chat-pane, .support-pane, .gpt-chat, .gpt-results) {
  background: var(--screen-material);
  border: 3px solid var(--case-mid);
  border-radius: 12px;
  box-shadow:
    0 0 0 1px var(--case-seam),
    var(--screen-shadow);
  overflow: hidden;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.chat-scroll, .gpt-message-scroll, .pane-scroll) {
  box-shadow: var(--screen-shadow);
}
/* Content wells own screen colors; only structural rims use the plastic palette. */
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) :is(.project-files, .results-pane) {
  background: var(--screen-material);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.inspector-scroll, .results-pane > .pane-scroll) {
  box-shadow: var(--screen-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) :is(.composer, .gpt-composer) {
  border: 3px solid var(--case-mid);
  border-top-color: var(--case-low);
  border-bottom-color: var(--case-top);
  border-radius: 9px;
  background: var(--paper);
  box-shadow:
    var(--screen-shadow),
    0 0 0 1px var(--case-seam);
}
:root[data-theme="crt-green"] :is(.composer, .gpt-composer) {
  border-radius: 5px;
}
:root[data-theme="hitech-2000s"] :is(.primary, .send-button) {
  color: #193c34;
  background: linear-gradient(#f7dc8e, #dfb95e);
  border: 1px solid #9e813f;
  border-radius: 8px;
  box-shadow:
    inset 0 1px #fff5d9,
    0 2px 0 #8f743b,
    0 3px 3px #092e332b;
}
:root[data-theme="hitech-2000s"] .secondary {
  color: var(--ink);
  background: var(--card-material);
  border: 1px solid var(--line);
  border-radius: 7px;
  box-shadow: var(--card-shadow);
}
:root[data-theme="hitech-2000s"] :is(.avatar, .gpt-chat .avatar) {
  color: var(--ink);
  background: #b4d8a0;
  border: 1px solid #789775;
  border-radius: 8px;
  box-shadow:
    inset 0 1px #fff9,
    0 2px #6b84603b;
}
:root[data-theme="hitech-2000s"] :is(.message.user .avatar, .gpt-chat .user .avatar) {
  background: #98cadd;
}
:root[data-theme="hitech-2000s"] .message.user .message-body {
  background: #edf2e9;
  border: 1px solid #ccd9ce;
  border-radius: 8px;
}
:root[data-theme="hitech-2000s"] :is(.nav-project.selected, .nav-thread.selected) {
  background: var(--tab-material);
  color: var(--ink);
  border-radius: 7px;
  box-shadow: var(--selected-shadow);
}
:root[data-theme="hitech-2000s"]
  :is(.result-card, .overview-card, .repository-card, .plan-section) {
  background: var(--card-material);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
}
:root[data-theme="hitech-2000s"] .result-title {
  background: linear-gradient(#f7faf0, #dce9d4);
  border-bottom: 1px solid var(--line);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(
    .settings-dialog,
    .project-dialog,
    .notebook-dialog,
    .project-overview-modal,
    .project-setup-dialog,
    .project-gpt-window,
    .gpt-settings
  ) {
  background: var(--surface);
  border: 3px solid var(--case-mid);
  border-top-color: var(--case-edge);
  border-bottom-color: var(--case-low);
  box-shadow:
    0 0 0 1px var(--case-seam),
    inset 0 1px #fff,
    0 14px 45px #0006;
  border-radius: 14px;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.notebook-editor, .core-content, .project-overview) {

}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .notebook-list {

}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])

}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])

}

.theme-option.hitech-2000s .theme-swatch {

:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])

    .header-connection,

  color: var(--case-muted);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .workspace-header > .icon-button {
  border: 1px solid var(--case-seam);
  border-top-color: var(--case-edge);
  border-radius: 8px;

  box-shadow:
    inset 0 1px var(--case-glint),

    0 1px 2px #0004;
}

}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .support-tabs button.active svg {
  color: var(--case-ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])

  svg {

}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])

  background: var(--case-pressed);
  box-shadow: var(--case-pressed-shadow);
  border-color: var(--case-edge);
  text-shadow: var(--cap-letter-shadow);
}

/* Each control owns its foreground when its surface differs from the casing. */
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.core-footer, .notebook-heading, .dialog-heading, .inspector-heading)
  :is(.primary, .secondary) {
  color: var(--cap-ink);
  background: var(--cap-surface);
  border: 1px solid var(--case-seam);
  box-shadow:
    inset 0 1px var(--case-glint),
    0 1px 2px #0004;
  text-shadow: var(--cap-letter-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  .workspace-shortcuts
  button:is(:hover, :focus-visible),
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  .workspace-shortcuts
  button:is(:hover, :focus-visible)
  svg {
  color: var(--ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(
    .navigation-system-row,
    .notebook-heading,
    .inspector-heading,
    .project-overview-heading,
    .dialog-heading,
    .gpt-settings-heading
  )
  .icon-button:active {
  color: var(--case-ink);
  background: var(--case-low);
  box-shadow: inset 0 2px 3px #0005;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.core-heading-title small, .core-footer > span) {
  color: var(--case-muted);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.notebook-heading, .inspector-heading)
  > svg {
  color: var(--case-muted);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.header-project, .nav-bottom, .workspace-shortcuts, .navigation-top-row, .nav-mobile-switch) {
  text-shadow: var(--case-letter-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(
    .inspector-heading small,
    .mobile-tabs > button,
    .support-tabs > button,
    .notebook-modules > button,
    .inspector-tabs > button
  ) {
  color: var(--case-ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.mobile-tabs, .support-tabs, .nav-mobile-switch)
  :is(.tab-count, .badge, .activity-badge) {
  color: var(--cap-ink);
  background: var(--case-pressed);
  text-shadow: var(--cap-letter-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.mobile-tabs, .support-tabs, .nav-mobile-switch)
  button:focus-visible {
  outline-color: var(--case-ink);
}

.case-color-picker {
  margin: 14px 0 4px;
  padding: 0;
  border: 0;
  min-width: 0;
}
.case-color-picker legend {
  font-size: 14px;
  padding: 0 0 8px;
}
.case-color-picker legend span {
  margin-left: 8px;
  font-size: 12px;
  color: var(--muted);
}
.case-color-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(44px, 1fr));
  gap: 5px;
}
button.case-swatch {
  height: 44px;
  min-width: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: var(--polymer-ink);
  border: 1px solid color-mix(in srgb, var(--polymer-tint) 40%, #172026);
  background: linear-gradient(
    150deg,
    color-mix(in srgb, var(--polymer-tint) 94%, #fff),
    var(--polymer-tint)
  );
  box-shadow:
    inset 0 1px color-mix(in srgb, var(--polymer-tint) 55%, #fff),
    inset 0 -2px #0003,
    0 1px 2px #0003;
}
button.case-swatch[aria-pressed="true"] {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button.case-swatch:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) {
  background: var(--case-surface);
  color: var(--case-ink);
  border-color: var(--case-seam);
  box-shadow: var(--case-shadow);
}
.case-color-error {
  font-size: 13px;
  color: var(--danger);
}

@media (min-width: 600px) {
  .case-color-options {
    grid-template-columns: repeat(6, minmax(44px, 1fr));
  }
}
@media (min-width: 1100px) {
  :root:not([data-layout="legacy"]):is([data-theme="crt-green"], [data-theme="hitech-2000s"])
    .workspace:not([data-remote-immersive="true"]) {
    padding: 9px;
    gap: 0;
    grid-template-rows: 65px minmax(0, 1fr);
    border-radius: 18px;
  }
  :root:not([data-layout="legacy"]):is([data-theme="crt-green"], [data-theme="hitech-2000s"])
    .workspace-header {
    margin-bottom: 6px;
  }
}
@media (max-width: 1099px) {
  :root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
    .workspace:not([data-remote-immersive="true"]) {
    padding: 3px;
  }
  :root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .workspace-header {
    margin: 0;
    border-radius: inherit;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
  }
  :root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
    :is(.chat-pane, .support-pane, .gpt-chat, .gpt-results) {
    border-radius: 0;
  }
}
@media (max-width: 400px) {
  :root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) .navigation-system-row {
    padding-inline: 5px;
  }
}
@media (prefers-reduced-motion: reduce) {
  :root button.client-picker::before,
  :root button.client-picker > svg {
    transition: none;
  }
}
@media (forced-colors: active) {
  :root button.client-picker::before {
    border: 1px solid ButtonText;
  }
}

/* Independent keycaps: surfaces, ink and relief travel together. */
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
:is(
  .workspace-header > .icon-button,
  .navigation-system-row .icon-button,
  .navigation-system-row .nav-remote,
  .core-footer .primary,
  .core-footer .secondary
) {
  background: var(--cap-surface);
  color: var(--cap-ink);
  box-shadow: var(--cap-shadow);
  border: 1px solid var(--case-seam);
  border-radius: 8px;
  text-shadow: var(--cap-letter-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(
    .workspace-header > .icon-button,
    .navigation-system-row .icon-button,
    .navigation-system-row .nav-remote,
    .core-footer .primary,
    .core-footer .secondary
  ):active {
  color: var(--cap-ink);
  background: var(--case-pressed);
  box-shadow: var(--case-pressed-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) button.client-picker {
  color: var(--cap-ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"]) button.client-picker > svg {
  filter: drop-shadow(0 1px 0 #0004);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(
    .mobile-tabs > .active,
    .support-tabs button.active,
    .workspace[data-view="chat"] .support-tabs button:first-child,
    .notebook-modules button[aria-pressed="true"],
    .inspector-tabs button.active,
    .nav-mobile-switch button.selected
  ) {
  color: var(--cap-ink);
  text-shadow: var(--cap-letter-shadow);
  font-weight: 600;
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.support-tabs button.active, .workspace[data-view="chat"] .support-tabs button:first-child)
  svg {
  color: var(--cap-ink);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.header-project, .quick-capture-dialog > header) {
  text-shadow: var(--case-letter-shadow);
}
:root:is([data-theme="crt-green"], [data-theme="hitech-2000s"])
  :is(.nav-mobile-switch, .nav-bottom, .workspace-shortcuts, .navigation-inner > .workspace-links) {
  border-color: color-mix(in srgb, var(--case-edge) 45%, var(--case-mid));
}

/* Variants change materials only. Family geometry, casing and content are shared. */
.theme-variant-picker {
  margin: 14px 0;
  padding: 0;
  border: 0;
  min-width: 0;
}
.theme-variant-picker legend {
  margin-bottom: 8px;
}
.theme-variant-options {
  display: flex;
  gap: 8px;
}
.theme-variant-options button {
  flex: 1;
  min-width: 0;
  padding: 10px 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card-material);
  color: var(--ink);
}
.theme-variant-options button[aria-pressed="true"] {
  background: var(--soft);
  border-color: var(--accent);
  box-shadow: var(--selected-shadow);
}

:root[data-theme="organizer"][data-theme-variant="dark"] {
  --paper: #24221e;
  --canvas: #191816;
  --nav: #292722;
  --surface: #302d27;
  --ink: #eee6d4;
  --muted: #b9b09e;
  --line: #625b49;
  --gold: #c2a46b;
  --danger: #f1a397;
  --accent: color-mix(in srgb, var(--polymer-tint) 40%, #f0e8d7);
  --accent-ink: #1e201d;
  --soft: color-mix(in srgb, var(--polymer-tint) 22%, var(--paper));
  --shadow: 0 8px 24px #0004;
  --panel-material: linear-gradient(100deg, #1d1c19, #302d27 12%, #27251f);
  --panel-heading: linear-gradient(#393429, #2a2721);
  --card-material: linear-gradient(110deg, #332f27, #292720);
  --card-shadow: inset 0 1px #c2a46b19, 0 2px 5px #0003;
  --field-shadow: inset 0 1px 3px #0005, 0 1px #c2a46b20;
  --selected-shadow: inset 3px 0 var(--accent), 0 1px 2px #0004;

}
:root[data-theme="organizer"][data-theme-variant="dark"] .workspace {
  background: linear-gradient(
    90deg,
    #151411,
    #302d25 18px,
    #24221e 33px,
    #28251f calc(100% - 22px),
    #171612
  );
  box-shadow:
    inset 0 0 0 1px #897347,
    inset 0 -4px 0 #161512;
}
:root[data-theme="organizer"][data-theme-variant="dark"] .workspace::after {
  opacity: 0.65;
}
:root[data-theme="organizer"][data-theme-variant="dark"] .desktop-nav {
  background: var(--panel-material);
  border-color: var(--line);
  box-shadow:
    3px 0 4px #0004,
    inset 0 1px #c2a46b33;
}
:root[data-theme="organizer"][data-theme-variant="dark"]
  :is(
    .workspace-header,
    .mobile-tabs,
    .result-title,
    .result-title:has(.badge.success),
    .notebook-heading,
    .project-overview-heading
  ) {
  background: var(--panel-heading);
  border-color: var(--line);
  box-shadow:
    inset 0 -1px #c2a46b33,
    0 1px 2px #0004;
}
:root[data-theme="organizer"][data-theme-variant="dark"]
  :is(
    .nav-brand,
    .header-project,
    .pane-heading,
    .notebook-heading > strong,
    .project-overview-heading > strong
  ) {
  color: var(--gold);
  text-shadow:
    0 -1px #000,
    0 1px #d9bc7a26;
}
:root[data-theme="organizer"][data-theme-variant="dark"]
  :is(.chat-pane, .gpt-chat, .support-pane, .gpt-results) {
  background: radial-gradient(ellipse at 40% 35%, #c4b48308, transparent 70%), var(--paper);
}
:root[data-theme="organizer"][data-theme-variant="dark"] :is(.composer, .gpt-composer) {
  background: var(--card-material);
  box-shadow: var(--card-shadow);
}
:root[data-theme="organizer"][data-theme-variant="dark"] .result-card {
  border-color: var(--line);
  box-shadow: var(--card-shadow);
}
:root[data-theme="organizer"][data-theme-variant="dark"] .notebook-modules button {
  background: linear-gradient(
    color-mix(in srgb, var(--tab-tint) 18%, var(--surface)),
    var(--surface)
  );
  color: var(--ink);
  border-color: var(--line);
  box-shadow: inset 0 1px #c2a46b33;
}
:root[data-theme="organizer"][data-theme-variant="dark"] :is(.notebook-modules, .inspector-tabs) {
  box-shadow: inset 0 -1px var(--gold);
}
:root[data-theme="organizer"][data-theme-variant="dark"]
  .notebook-modules
  button[aria-pressed="true"] {
  border-bottom-color: var(--accent);
}
:root[data-theme="organizer"][data-theme-variant="dark"] .notebook-body {
  background-image: repeating-linear-gradient(
    transparent 0 calc(1.7em - 1px),
    #c2a46b12 calc(1.7em - 1px) 1.7em
  );
}
:root[data-theme="organizer"][data-theme-variant="dark"] .overview-card {
  border-top-color: var(--gold);
}

/* Neutral terminal: silver LCD or graphite phosphor, without a green raster/glow. */
:root[data-theme="crt-green"][data-theme-variant="dark"] {
  --paper: #17191c;
  --canvas: #101214;
  --nav: #1a1d20;
  --surface: #22262a;
  --ink: #dce0e4;
  --muted: #a9b0b7;
  --line: #596169;
  --accent: #d4dae0;
  --accent-ink: #191c20;
  --soft: #343a40;
  --gold: #bcc4cd;
  --danger: #ffb19e;
  --screen-material: linear-gradient(110deg, #1b1e22, #17191c);
  --screen-shadow: inset 0 2px 6px #0008, inset 0 0 0 1px #b5bbc315;
}
:root[data-theme="crt-green"][data-theme-variant="light"] {
  --paper: #cbd0cf;
  --canvas: #b7bdbc;
  --nav: #c2c8c7;
  --surface: #d5d9d7;
  --ink: #252d2e;
  --muted: #4c5757;
  --line: #798483;
  --accent: #344143;
  --accent-ink: #edf0eb;
  --soft: #afbaba;
  --gold: #515e5f;
  --danger: #8c302c;
  --screen-material:
    linear-gradient(115deg, #e0e3dd55, transparent 45%, #6d7a7820),
    repeating-linear-gradient(0deg, #28343206 0 1px, transparent 1px 3px), #cbd0cf;
  --screen-shadow: inset 0 2px 7px #25333055, inset 0 -1px #f2f5ec88;
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"]) {
  --crt-glow: none;
  --crt-strong-glow: none;
  --crt-raster: linear-gradient(transparent, transparent);
  --panel-material: var(--screen-material);
  --card-material: linear-gradient(110deg, var(--surface), var(--paper));
  --card-shadow: inset 0 1px #aab5ba20, 0 1px 3px #0002;
  --field-shadow: inset 0 1px 4px #0004;
  --tab-material: var(--soft);
  --selected-shadow: inset 2px 0 var(--accent);
  --shadow: 0 8px 24px #0004;
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])

  border-color: var(--line);

}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])
  .message.user
  .message-body {
  background: var(--soft);
  border-color: var(--line);
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])
  .result-title {
  background: var(--surface);
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])
  .nav-project.selected {
  box-shadow: var(--selected-shadow);
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])

  :is(small, .folder-icon) {
  color: var(--accent-ink);
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])
  .login-card {
  background: var(--screen-material);
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])

  filter: none;
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])
  .nav-search {
  background: var(--paper);
  color: var(--ink);
}
:root[data-theme="crt-green"]:is([data-theme-variant="dark"], [data-theme-variant="light"])
  ::selection {
  background: var(--accent);
  color: var(--accent-ink);
}

  box-shadow: inset 0 1px 3px #26332f88;
}
.theme-option.hitech-2000s[data-variant="dark"] .theme-swatch {
  box-shadow:
    inset -8px 0 #1b262a,
    inset 0 1px #c5edda;
}
.theme-option.classic-dark[data-variant="light"] .theme-swatch {
  background: #eef0f3;
  box-shadow: inset 0 0 0 1px #aab3bf;
}

/* Palette chips preview the same independent accent as the selected variant. */
.case-swatch[data-theme="organizer"][data-theme-variant="dark"] {
  --accent: color-mix(in srgb, var(--polymer-tint) 40%, #f0e8d7);
  --accent-ink: #1e201d;
}
.case-swatch[data-theme="classic-dark"][data-theme-variant="light"] {
  --accent: var(--paper-accent);
  --accent-ink: #fff;
}

:root {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 8px;
  --radius-sm: 5px;
  --radius-lg: 14px;
  --nav-width: 235px;
  --results-width: 310px;
  --case-surface: var(--nav);
  --case-ink: var(--ink);
  --case-seam: var(--line);
  --case-edge: var(--line);
  --cap-surface: var(--surface);
  --cap-ink: var(--ink);
  --screen-material: var(--paper);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  overflow: hidden;
}
button,
input,
textarea,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
button,
select {
  touch-action: manipulation;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
svg.icon {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
button svg {
  pointer-events: none;
}
h1,
h2,
h3,
p {
  margin: 0 0 16px;
}
h1 {
  font-size: 30px;
}
h2 {
  font-size: 22px;
}
h3 {
  font-size: 16px;
}
small,
.muted {
  color: var(--muted);
}
small {
  font-size: 12px;
}
a {
  color: inherit;
}
button {
  color: inherit;
}
.spacer {
  flex: 1;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.stack {
  display: grid;
  gap: 14px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}
.hidden,
[hidden] {
  display: none !important;
}
.demo-bar {
  height: 52px;
  padding: 7px 18px;
  display: flex;
  align-items: center;
  gap: 24px;
  background: var(--case-surface);
  color: var(--case-ink);
  border-bottom: 1px solid var(--case-seam);
  font-size: 13px;
}
.demo-label {
  font-weight: 400;
  opacity: 0.7;
  margin-left: 12px;
}
.demo-explanation {
  font-size: 11px;
  opacity: 0.7;
}
.demo-bar-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-left: auto;
}
.bar-button {
  background: transparent;
  border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
  border-radius: 6px;
  padding: 7px 10px;
}
.demo-bar select {
  max-width: 155px;
  font-size: 12px;
}
.demo-deck {
  position: relative;
  height: calc(100dvh - 52px);
  display: grid;
  grid-template-columns: var(--nav-width) 7px minmax(0, 1fr);
  padding: 9px;
  background: var(--case-surface);
  color: var(--case-ink);
  border: 2px solid var(--case-seam);
  border-radius: 18px;
  box-shadow:
    inset 0 1px var(--case-edge),
    inset 0 -4px #0003;
}
.navigation {
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.nav-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 12px 20px;
  font-size: 20px;
  letter-spacing: 0.02em;
}
#nav-content {
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
  padding: 0 8px 7px;
}
.nav-section {
  padding: 7px;
  border-radius: 7px;
  background: var(--screen-material);
  color: var(--ink);
  box-shadow: var(--screen-shadow);
}
.nav-section > small {
  display: block;
  padding: 10px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  color: inherit;
  border-radius: 5px;
  padding: 12px 9px;
  font-size: 13px;
}
.nav-item > span {
  min-width: 0;
  flex: 1;
}
.nav-item > .status-dot {
  flex: 0 0 7px;
}
.nav-tools button {
  min-width: 0;
  overflow: hidden;
}
.nav-item small {
  display: block;
  margin-top: 4px;
  font-size: 10px;
}
.nav-item.active {
  background: var(--soft);
  box-shadow: var(--selected-shadow);
}
.nav-item:hover {
  background: var(--soft);
}
.nav-tools {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.nav-tools button {
  display: grid;
  justify-items: center;
  gap: 6px;
  font-size: 10px;
  padding: 10px 3px;
}
.nav-bottom {
  margin-top: auto;
}
.key,
.icon-button,
.nav-tools button,
.window-controls button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--cap-surface, var(--surface));
  color: var(--cap-ink, var(--ink));
  border: 1px solid var(--case-seam, var(--line));
  border-radius: 8px;
  box-shadow: var(--cap-shadow);
  padding: 10px 13px;
  min-height: 40px;
}
.icon-button,
.window-controls button {
  width: 42px;
  height: 42px;
  padding: 8px;
  flex-shrink: 0;
}
.key:active,
.icon-button:active {
  box-shadow: var(--case-pressed-shadow);
  transform: translateY(1px);
}
.primary {
  padding: 10px 18px;
  min-height: 40px;
  background: var(--accent);
  color: var(--accent-ink);
  border: 1px solid transparent;
  border-radius: 7px;
  font-weight: 600;
}
.splitter {
  cursor: col-resize;
  touch-action: none;
  position: relative;
}
.splitter:after {
  content: "";
  position: absolute;
  width: 3px;
  height: 34px;
  top: 50%;
  left: 2px;
  border-radius: 3px;
  background: var(--case-ink);
  opacity: 0.2;
}
.splitter:hover:after,
.splitter:focus-visible:after {
  opacity: 0.65;
}
.main-workspace {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.workspace-top {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 76px;
  padding: 3px 7px 12px;
}
.project-heading {
  flex: 1;
  min-width: 0;
}
.project-heading strong {
  display: block;
  font-size: 19px;
}
.project-heading small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 4px;
  color: inherit;
  opacity: 0.65;
}
.workspace-body {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) 7px var(--results-width);
  min-height: 0;
  flex: 1;
}
.screen {
  background: var(--screen-material, var(--paper));
  color: var(--ink);
  border: 3px solid var(--case-seam);
  border-radius: 8px;
  box-shadow: var(--screen-shadow);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.conversation {
  display: flex;
  flex-direction: column;
}
.chat-feed {
  flex: 1;
  overflow: auto;
  padding: 28px clamp(16px, 4vw, 55px);
  scroll-behavior: smooth;
}
.message {
  margin-bottom: 26px;
  line-height: 1.7;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.message-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 12px;
}
.avatar {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--soft);
  font-weight: 700;
}
.message.user .message-body {
  background: var(--soft);
  border: 1px solid var(--line);
  padding: 14px 17px;
  border-radius: 9px;
}
.message-head time {
  color: var(--muted);
  font-size: 10px;
}
.message-body h2 {
  font-size: 20px;
}
.message-body p {
  margin-bottom: 14px;
}
.message-body ul {
  padding-left: 22px;
}
.message-body img {
  width: 100%;
  border-radius: 6px;
}
.message-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}
.text-button {
  background: none;
  border: 0;
  color: var(--ink);
  padding: 7px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.badge {
  display: inline-block;
  font-size: 10px;
  line-height: 1.3;
  padding: 4px 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--soft);
  font-weight: 500;
}
.composer {
  margin: 0 14px 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 12px;
  background: var(--paper);
  box-shadow: var(--field-shadow);
}
.composer-options {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}
.composer-options select {
  max-width: 115px;
  border: 0;
  background: transparent;
  padding: 4px;
}
.composer textarea {
  resize: none;
  width: 100%;
  border: 0 !important;
  background: transparent;
  padding: 14px 2px;
  outline: none !important;
  line-height: 1.5;
  color: var(--ink);
  font-size: 14px;
}
.composer-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.composer-actions .icon-button {
  box-shadow: none;
  background: transparent;
  border: 0;
  color: var(--ink);
}
.composer small {
  font-size: 10px;
}
.results {
  display: flex;
  flex-direction: column;
}
.pane-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 17px 14px;
}
.pane-title strong {
  font-size: 17px;
}
.tabs {
  display: flex;
  gap: 4px;
  padding: 7px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  flex-shrink: 0;
}
.tabs button {
  border: 0;
  border-radius: 5px;
  background: none;
  white-space: nowrap;
  padding: 10px;
  color: var(--ink);
  font-size: 12px;
}
.tabs button.active {
  background: var(--soft);
  box-shadow: var(--selected-shadow);
}
.result-content {
  overflow: auto;
  padding: 15px;
  flex: 1;
}
.file-row {
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  padding: 13px 6px;
  font-size: 12px;
}
.file-row > button:first-child {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: none;
  border: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 3px;
  color: inherit;
}
.file-row span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-row small {
  display: block;
  font-size: 10px;
  margin-top: 5px;
}
.image-card {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 6px;
  margin-bottom: 14px;
  background: var(--surface);
}
.image-card img {
  width: 100%;
  display: block;
  border-radius: 4px;
}
.image-card .image-open {
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
}
.image-card .overflow {
  position: absolute;
  top: 12px;
  right: 12px;
  background: var(--paper);
}
.image-card p {
  font-size: 12px;
  margin: 12px 6px 6px;
}
.phone-tabs,
.mobile-only {
  display: none;
}
.dock {
  position: absolute;
  top: 86px;
  left: calc(var(--nav-width) + 8px);
  z-index: 20000;
  border: 1px solid var(--case-seam);
  background: var(--case-surface);
  padding: 5px;
  border-radius: 10px;
  box-shadow: var(--cap-shadow);
  display: grid;
  gap: 7px;
}
.dock button {
  width: 39px;
  height: 39px;
}
.demo-window {
  position: absolute;
  z-index: 100;
  left: 13%;
  top: 6%;
  width: min(960px, 84%);
  height: min(670px, 88%);
  min-width: 320px;
  min-height: 260px;
  background: var(--case-surface, var(--nav));
  color: var(--case-ink, var(--ink));
  border: 2px solid var(--case-seam);
  border-radius: 15px;
  box-shadow:
    inset 0 1px var(--case-edge),
    0 24px 75px #0007;
  display: flex;
  flex-direction: column;
  padding: 9px;
  animation: arrive 0.18s ease-out;
  resize: both;
  overflow: hidden;
}
.demo-window.front {
  box-shadow:
    inset 0 1px var(--case-edge),
    0 24px 75px #0008;
}
.window-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 3px 12px;
  cursor: move;
  touch-action: none;
  user-select: none;
  flex-shrink: 0;
}
.window-heading h2 {
  font-size: 17px;
  margin: 0;
  flex: 1;
}
.window-controls {
  display: flex;
  gap: 5px;
}
.window-controls button {
  width: 34px;
  height: 34px;
  min-height: 34px;
  box-shadow: none;
  background: transparent;
  border: 0;
  color: inherit;
}
.window-body {
  background: var(--screen-material, var(--paper));
  color: var(--ink);
  border: 3px solid var(--case-seam);
  border-radius: 6px;
  min-height: 0;
  flex: 1;
  overflow: auto;
}
.padded {
  padding: 24px;
}
.window-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 5px 0;
  font-size: 10px;
  opacity: 0.75;
}
.toolbar {
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.toolbar .icon-button {
  color: var(--ink);
  background: var(--surface);
  box-shadow: none;
  border-color: var(--line);
  width: 36px;
  height: 36px;
  min-height: 36px;
}
.toolbar input {
  min-width: 100px;
  flex: 1;
}
.content-split {
  display: grid;
  grid-template-columns: 220px 7px minmax(0, 1fr);
  height: 100%;
  min-height: 0;
}
.content-list {
  overflow: auto;
  min-width: 0;
  border-right: 1px solid var(--line);
}
.content-detail {
  min-width: 0;
  overflow: auto;
  padding: 22px;
}
.content-list .nav-item {
  border-radius: 0;
}
.files-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.files-split {
  flex: 1;
  min-height: 0;
  grid-template-columns: var(--list, 220px) 7px minmax(0, 1fr);
}
.file-content {
  white-space: pre-wrap;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.file-editor {
  width: 100%;
  height: 100%;
  min-height: 260px;
  resize: none;
  border: 0 !important;
  font-family: ui-monospace, Consolas, monospace;
  line-height: 1.6;
  font-size: 13px;
  background: transparent;
  color: var(--ink);
}
input,
textarea,
select {
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px;
  max-width: 100%;
}
label {
  font-size: 13px;
}
label > input:not([type="checkbox"]):not([type="radio"]),
label > textarea,
label > select {
  display: block;
  width: 100%;
  margin-top: 7px;
}
input[type="checkbox"] {
  accent-color: var(--accent);
}
.card {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 17px;
  background: var(--card-material, var(--surface));
}
.card p {
  font-size: 13px;
  line-height: 1.6;
}
.card h3 {
  margin-bottom: 9px;
}
.card .badge {
  margin-bottom: 8px;
}
details {
  border: 1px solid var(--line);
  border-radius: 6px;
  margin: 12px 0;
  padding: 12px;
  font-size: 13px;
}
summary {
  cursor: pointer;
  font-weight: 600;
}
details > div {
  margin-top: 14px;
  line-height: 1.7;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
  padding: 15px;
  font-size: 12px;
  background: var(--paper);
  line-height: 1.7;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
td,
th {
  text-align: left;
  border-bottom: 1px solid var(--line);
  padding: 10px;
}
td input {
  width: 100%;
}
.feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.feature-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--card-material, var(--surface));
  padding: 16px;
  border-radius: 8px;
  color: var(--ink);
}
.feature-card:hover {
  border-color: var(--accent);
  background: var(--soft);
}
.feature-card p {
  font-size: 12px;
  line-height: 1.5;
  margin: 0;
  color: var(--muted);
}
.feature-card .row {
  font-size: 14px;
}
.section-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 22px 0 12px;
}
.receipt {
  border-left: 3px solid var(--accent);
  padding: 16px;
  background: var(--soft);
  margin-top: 20px;
  font-size: 13px;
  line-height: 1.7;
}
.notice {
  padding: 12px 15px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}
.metric {
  font-size: 27px;
  font-weight: 600;
  margin: 10px 0;
}
.progress {
  height: 6px;
  background: var(--line);
  border-radius: 5px;
  overflow: hidden;
  margin: 10px 0;
}
.progress span {
  display: block;
  height: 100%;
  background: var(--accent);
}
.terminal {
  background: #07130c;
  color: #aaf5b8;
  padding: 18px;
  font:
    13px / 1.8 ui-monospace,
    monospace;
  min-height: 250px;
  white-space: pre-wrap;
  overflow: auto;
}
.terminal-form {
  display: flex;
  gap: 8px;
  padding: 10px;
}
.terminal-form input {
  flex: 1;
  font-family: ui-monospace, monospace;
}
.remote-desktop {
  background: linear-gradient(125deg, #253c5a, #5c4867);
  height: 280px;
  position: relative;
  color: #fff;
  border-radius: 8px;
  padding: 16px;
  display: flex;
  gap: 15px;
  align-items: flex-start;
}
.remote-app {
  position: absolute;
  inset: 65px 30px 30px;
  background: #f9fafb;
  color: #273142;
  box-shadow: 0 8px 35px #0005;
  border-radius: 7px;
  overflow: auto;
  padding: 16px;
}
.remote-desktop > button {
  background: #ffffff19;
  border: 1px solid #ffffff44;
  color: #fff;
  padding: 12px;
  border-radius: 6px;
}
.preview-art {
  display: block;
  width: 100%;
  border-radius: 6px;
}
.annotator {
  position: relative;
  touch-action: none;
}
.annotator canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}
.menu-pop {
  position: absolute;
  z-index: 40000;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 5px;
  border-radius: 8px;
  box-shadow: 0 8px 35px #0004;
  min-width: 170px;
}
.menu-pop button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 9px;
  background: none;
  border: 0;
  text-align: left;
  padding: 11px;
  color: inherit;
}
.menu-pop button:hover {
  background: var(--soft);
}
#toast {
  position: fixed;
  bottom: 20px;

    const canvas = $("canvas", body),
      ctx = canvas.getContext("2d");
    let drawing = false;
    const point = (e) => {
      const r = canvas.getBoundingClientRect();
      return [((e.clientX - r.left) * 900) / r.width, ((e.clientY - r.top) * 560) / r.height];
    };
    canvas.onpointerdown = (e) => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      ctx.beginPath();
      ctx.moveTo(...point(e));
    };
    canvas.onpointermove = (e) => {
      if (!drawing) return;
      ctx.strokeStyle = $("input[type=color]", body).value;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.lineTo(...point(e));
      ctx.stroke();
    };
    canvas.onpointerup = () => (drawing = false);
    canvas.onpointercancel = () => (drawing = false);
    body.onclick = (e) => {
      const step = e.target.closest("[data-image-step]");
      if (step) {
        imageIndex = (imageIndex + Number(step.dataset.imageStep) + 2) % 2;

      const action = e.target.closest("[data-image-action]")?.dataset.imageAction;
      if (action === "clear") ctx.clearRect(0, 0, 900, 560);
      if (action === "export") {
        const out = document.createElement("canvas");
        out.width = 900;
        out.height = 560;

      text:
        (mode === "Plan"
          ? "Example plan: inspect the gallery, check phone and tablet layouts, then review the release notes. Open Plans to adjust the steps. No files were changed."
          : response) +
        "\n\nDemo settings: " +
        mode +
        " / " +
        effort +
        " effort.",
    });
    state.draft = "";
    state.attachment = "";
    $("#prompt").value = "";
    $("#attachment-label").textContent = "";
    renderChat();
    $("#chat-feed").scrollTop = $("#chat-feed").scrollHeight;
    record("Demo " + state.client + " reply ready");
  };
  $("#prompt").oninput = (e) => (state.draft = e.target.value);
  $("#model").onchange = (e) => {
    state.client = e.target.value;
    renderChat();
    renderHeader();
  };
  $("#finish").onchange = (e) => setFinish(e.target.value);
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      open("search");
    }
    if (e.key === "Escape") {
      const menu = $(".menu-pop");
      if (menu) {
        menu.remove();
        return;
      }
      const top = [...windows.values()]
        .filter((w) => !w.hidden)
        .sort((a, b) => +b.style.zIndex - +a.style.zIndex)[0];
      if (top) {
        top.hidden = true;
        top.dataset.closed = "true";
        renderDock();
      }
    }
  });
  window.addEventListener("resize", () => {
    for (const w of windows.values()) {
      if (innerWidth <= 760 && w.hidden && w.dataset.closed === "false") w.hidden = false;
      if (!w.hidden) constrain(w);
    }
    renderDock();
  });
  setFinish(storage.read("finish", "burgundy"));
  renderNav();
  renderHeader();
  renderChat();
  renderResults();
  $("[data-action=attach]").innerHTML = icon("plus");
  $("[data-open=dictation]").innerHTML = icon("microphone");
  if (innerWidth <= 760) $("#deck").classList.add("nav-closed");
  split($("#nav-splitter"), document.documentElement, "--nav-width", 170, () =>
    Math.min(330, innerWidth * 0.32),
  );
  split(
    $("#results-splitter"),
    document.documentElement,
    "--results-width",
    230,
    () => Math.min(520, innerWidth * 0.45),
    true,
  );
})();
</script>
</body>
</html>
